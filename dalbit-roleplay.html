<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap');
  :root {
    --ink:#1a1410; --paper:#f5efe6; --moon:#e8d5a3;
    --ember:#c9623f; --jade:#4a7c6f; --shadow:#2d2118;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--shadow);font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .bg-particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .particle{position:absolute;border-radius:50%;opacity:0;animation:drift linear infinite;background:var(--moon);}
  @keyframes drift{0%{transform:translateY(100vh);opacity:0;}10%{opacity:.5;}90%{opacity:.2;}100%{transform:translateY(-10vh) translateX(20px);opacity:0;}}
  #app{position:relative;z-index:1;width:100%;max-width:480px;height:100vh;max-height:860px;display:flex;flex-direction:column;background:var(--paper);overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.7);}
  @media(min-height:900px){#app{height:860px;border-radius:20px;}body{padding:20px;}}

  /* 씬 배너 */
  #scene-banner{flex-shrink:0;height:170px;position:relative;overflow:hidden;background:var(--shadow);}
  #scene-img{width:100%;height:100%;object-fit:cover;transition:opacity .9s ease,transform 7s ease;transform:scale(1.06);opacity:0;}
  #scene-img.loaded{opacity:1;transform:scale(1);}
  .scene-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(26,20,16,.3) 0%,rgba(26,20,16,.05) 40%,rgba(245,239,230,.97) 100%);}
  .scene-title{position:absolute;bottom:11px;left:15px;font-family:'Noto Serif KR',serif;color:var(--shadow);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-shadow:0 1px 6px rgba(245,239,230,.9);}
  .scene-chapter{position:absolute;top:10px;right:11px;font-size:10px;background:rgba(26,20,16,.55);color:var(--moon);padding:3px 9px;border-radius:20px;letter-spacing:.1em;}

  /* 헤더 */
  header{background:var(--shadow);color:var(--moon);padding:9px 15px;display:flex;align-items:center;gap:9px;border-bottom:1px solid rgba(232,213,163,.15);flex-shrink:0;}
  header h1{font-family:'Noto Serif KR',serif;font-size:14.5px;font-weight:600;letter-spacing:.06em;}
  header p{font-size:10px;opacity:.5;letter-spacing:.08em;}
  .hdr-icon{font-size:19px;}
  .hdr-char{margin-left:auto;font-size:11px;opacity:.7;display:flex;align-items:center;gap:5px;}

  /* 채팅 */
  #chat{flex:1;overflow-y:auto;padding:13px 13px 6px;display:flex;flex-direction:column;gap:11px;scroll-behavior:smooth;}
  #chat::-webkit-scrollbar{width:3px;}
  #chat::-webkit-scrollbar-thumb{background:rgba(26,20,16,.1);border-radius:2px;}
  .msg{display:flex;gap:7px;align-items:flex-end;animation:fadeUp .3s ease;}
  .msg.narrator{flex-direction:column;align-items:center;}
  .msg.user{flex-direction:row-reverse;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;border:1.5px solid rgba(232,213,163,.25);overflow:hidden;}
  .avatar.user-av{background:var(--jade);}
  .bubble-wrap{display:flex;flex-direction:column;}
  .sender-name{font-size:10px;color:rgba(26,20,16,.4);margin-bottom:3px;padding-left:2px;}
  .msg.user .sender-name{text-align:right;padding-right:2px;}
  .bubble{max-width:78%;padding:9px 13px;border-radius:16px;font-size:13px;line-height:1.65;color:var(--ink);}
  .msg.npc .bubble{background:white;border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
  .msg.user .bubble{background:var(--jade);color:white;border-bottom-right-radius:4px;}
  .msg.narrator .bubble{background:rgba(26,20,16,.05);border-radius:8px;font-family:'Noto Serif KR',serif;font-size:12px;color:rgba(26,20,16,.55);text-align:center;max-width:92%;font-style:italic;padding:7px 14px;border:1px dashed rgba(26,20,16,.1);}
  .typing{display:flex;gap:4px;align-items:center;padding:11px 14px;background:white;border-radius:16px;border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.07);width:fit-content;}
  .typing span{width:5px;height:5px;background:rgba(26,20,16,.28);border-radius:50%;animation:bounce 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}

  /* 선택지 */
  #choices{padding:8px 13px 4px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;border-top:1px solid rgba(26,20,16,.07);background:rgba(245,239,230,.96);}
  #choices.hidden{display:none;}
  .choice-label{font-size:9.5px;color:rgba(26,20,16,.35);letter-spacing:.12em;}
  .choice-btn{background:white;border:1.5px solid rgba(26,20,16,.1);border-radius:10px;padding:8px 12px;font-size:12.5px;font-family:'Noto Sans KR',sans-serif;color:var(--ink);cursor:pointer;text-align:left;transition:all .17s;display:flex;align-items:center;gap:8px;}
  .choice-btn:hover{background:var(--shadow);color:var(--moon);border-color:var(--shadow);transform:translateX(3px);}
  .choice-btn .cicon{font-size:14px;}

  /* 입력창 */
  #input-area{padding:8px 12px 12px;display:flex;gap:7px;align-items:flex-end;flex-shrink:0;background:var(--paper);border-top:1px solid rgba(26,20,16,.07);}
  #input-area.hidden{display:none;}
  #msg-input{flex:1;border:1.5px solid rgba(26,20,16,.13);border-radius:18px;padding:8px 13px;font-size:13px;font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:white;resize:none;outline:none;min-height:38px;max-height:90px;line-height:1.5;transition:border-color .2s;}
  #msg-input:focus{border-color:var(--jade);}
  #msg-input::placeholder{color:rgba(26,20,16,.32);}
  #send-btn{width:38px;height:38px;background:var(--shadow);color:var(--moon);border:none;border-radius:50%;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .17s;flex-shrink:0;}
  #send-btn:hover{background:var(--jade);transform:scale(1.08);}

  /* 시작 화면 */
  #start-screen{position:absolute;inset:0;z-index:20;overflow:hidden;display:flex;flex-direction:column;}
  #start-bg{position:absolute;inset:0;background:var(--shadow);}
  #start-bg img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease;filter:brightness(.32) saturate(.65);}
  #start-bg img.loaded{opacity:1;}
  .start-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(26,20,16,.97) 30%,rgba(26,20,16,.35) 100%);}
  .start-content{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 32px 44px;text-align:center;}
  .start-moon-icon{font-size:46px;margin-bottom:18px;animation:glow 3s ease-in-out infinite;}
  @keyframes glow{0%,100%{filter:drop-shadow(0 0 8px rgba(232,213,163,.4));}50%{filter:drop-shadow(0 0 22px rgba(232,213,163,.9));}}
  .start-title{font-family:'Noto Serif KR',serif;font-size:28px;font-weight:700;color:var(--moon);letter-spacing:.12em;margin-bottom:6px;}
  .start-sub{font-size:11px;color:rgba(232,213,163,.45);letter-spacing:.18em;margin-bottom:24px;}
  .start-desc{font-size:13px;color:rgba(232,213,163,.65);line-height:1.9;margin-bottom:32px;font-family:'Noto Serif KR',serif;font-style:italic;}
  .start-btn{background:var(--moon);color:var(--shadow);border:none;border-radius:30px;padding:13px 38px;font-size:14px;font-family:'Noto Serif KR',serif;font-weight:700;letter-spacing:.1em;cursor:pointer;transition:all .2s;}
  .start-btn:hover{transform:scale(1.05);box-shadow:0 4px 24px rgba(232,213,163,.35);}

  /* 캐릭터 선택 */
  #char-select{position:absolute;inset:0;z-index:19;background:var(--paper);display:flex;flex-direction:column;overflow-y:auto;}
  #char-select.hidden{display:none;}
  .char-header-bg{position:relative;height:130px;flex-shrink:0;overflow:hidden;background:var(--shadow);}
  .char-header-bg img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s;filter:brightness(.38) saturate(.6);}
  .char-header-bg img.loaded{opacity:1;}
  .char-header-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--moon);}
  .char-header-text h2{font-family:'Noto Serif KR',serif;font-size:15px;margin-bottom:4px;}
  .char-header-text p{font-size:11px;opacity:.55;}
  .char-list{padding:13px;display:flex;flex-direction:column;gap:9px;}
  .char-card{background:white;border-radius:13px;border:1.5px solid rgba(26,20,16,.09);cursor:pointer;overflow:hidden;display:flex;align-items:stretch;transition:all .2s;}
  .char-card:hover{border-color:var(--jade);transform:translateX(4px);box-shadow:0 2px 14px rgba(74,124,111,.15);}
  .char-thumb{width:70px;flex-shrink:0;position:relative;overflow:hidden;background:var(--shadow);}
  .char-thumb img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s;}
  .char-thumb img.loaded{opacity:1;}
  .char-thumb-fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;}
  .char-body{padding:11px 12px;flex:1;}
  .char-body h3{font-family:'Noto Serif KR',serif;font-size:13px;font-weight:600;margin-bottom:3px;}
  .char-body p{font-size:11px;color:rgba(26,20,16,.5);line-height:1.5;}
  .char-tag{font-size:10px;padding:2px 7px;border-radius:20px;margin-top:5px;display:inline-block;}
  .tag-easy{background:rgba(26,20,16,.06);color:rgba(26,20,16,.45);}
  .tag-middle{background:rgba(74,124,111,.1);color:var(--jade);}
  .tag-hard{background:rgba(201,98,63,.1);color:var(--ember);}
</style>
</head>
<body>

</div>

<script>
// 파티클
const pe=document.getElementById('particles');

loadImg(document.getElementById('start-bg-img'),IMGS.start);

const CHARS={
  newcomer:{name:'새로 온 령',emoji:'👤',tag:'입문',tagClass:'tag-easy',
    desc:'막 죽어서 달빛여관에 도착한 존재.<br>아무것도 모르는 상태에서 시작합니다.',
    intro:'어둠 속에서 눈을 뜬다. 마지막 기억은 흐릿하다.\n몸이 너무 가볍다— 이상할 정도로.\n\n눈앞에 나무로 된 여관이 서 있다.\n처마 끝 등롱이 달빛 아래 흔들리고 있다.\n\n달빛여관.'},
  hunter:{name:'중앙 차사',emoji:'⚔️',tag:'중급',tagClass:'tag-middle',
    desc:'요괴를 퇴치하는 중앙 소속 차사.<br>프람 타워의 지하 비밀을 추적 중입니다.',
    intro:'프람 타워에서 내려온 지령서. 임무: 달빛여관 인근 미확인 요괴 추적.\n\n지령서 뒤편 작은 메모가 신경 쓰인다.\n\'구 프람 관련 증인 확보.\'\n\n이건 공식 임무가 아니다.'},

    intro:'허기가 밀려온다. 마지막으로 먹은 게 언제인지 기억도 안 난다.\n\n영물로 위장한 채 달빛여관에 들어왔다.\n이곳은 중립지대— 주인의 힘이 미치는 동안엔 안전하다.\n\n문제는 얼마나 버틸 수 있느냐다.'},

let gameState={character:null,chapter:1,history:[]};

const WORLD_SYSTEM=`당신은 '달빛여관 — 영물세계 이야기' 역극 게임의 나레이터이자 NPC입니다.

[세계 기본]
- 배경: 가이아 대륙. 죽은 동식물이 영물이 되어 사는 사후세계. 약 5천 년 전 세상이 이야기로 열림.
- 영물: 선한 이야기로 태어난 존재. 양기 보유. 인간 외형+고유 신체(꼬리·날개·뿔 등). 구전·설화로 태어나거나 영물세계에서 태어난 2세 존재.
- 요괴: 악한 이야기로 태어난 존재. 음기 보유. 영물을 섭취해야 생존. 장기간 미섭취 시 소멸. 극히 드물게 영물↔요괴 변천 가능.
- 영력: 이야기에서 나오는 에너지. 판타지의 마나 역할. 양기(영물)·음기(요괴)로 구분.
- 술식: 빠르고 간단한 마법(일반 마법). 즉시 발동.
- 의식: 채널링 마법. 영력을 지속 집중할수록 위력 증가. 시전 시간 필요.
- 술식 4종류: 회복(청룡·잉어 가문 원조·식물계 파생) / 신체강화(백호·범 가문 원조·육상생물 파생) / 양기=오행 원소 공격(주작·참새 가문 원조·비행생물 파생) / 음기=방어(현무·거북 가문 원조·수생생물 파생).
- 양기: 오행(화수목금토) 기반 공격 원소 마법. 오행 혼합으로 새 술식 창조 가능. 따뜻한 것·밝은 것=양.
- 음기(영물): 주변 음기를 보호막처럼 두르는 방어 방식. 공격용으로 쓰기엔 양이 부족.
- 음기(요괴): 내부에서 직접 음기를 발동. 양기 술식은 기본적으로 사용 불가. 대신 신체 능력이 영물보다 월등히 강함.
- 술식 위력 공식: (양기량)-(음기량)=영물 위력 / (음기량)-(양기량)=요괴 위력.
- 경고: 양기+음기 동시 사용 시 생명에너지로 변환되어 즉시 소멸. 4신수도 예외 없음.
- 음양 치우침 전설: 음기나 양기 한쪽에 극단적으로 치우치면 요괴화·영물화 가능(미확인).
- 가문 술식: 선조 대대로 발전시킨 노력의 산물. 가문 특기가 반드시 개인 특기는 아님(예외 존재). 종으로 가문 설정(능력X). 사신수 뿌리와 비슷한 결로 작성 권장.
- 중앙 술식: 4신수 기초술식+개인 술식. 유출 사건으로 기초술식 습득 가능하게 됨.
- 술식 유출 사건: 중앙 평등 이념에 공감한 일부 가문이 사신수 술식을 외부 유출 → 중앙이 사신수에 맞먹는 권력 획득 → 가문과 중앙의 갈등 심화 (현재까지 이어지는 대립의 근본 원인).
- 중앙·가문 우호도: 청룡(우호)·주작(우호) / 백호(중립) / 현무(적대). 우호적인 청룡조차 영토·술식 문제로 말싸움 잦음.
- 용 가문 vs 잉어(청룡) 가문: 용=선천적 재능(서양 드래곤 포함), 잉어=후천적 노력(동양 청룡만). 등용문 설화에서 유래. 완전히 다른 가문.
- 영물·요괴 혼혈: 양기 강하면 영물, 음기 강하면 요괴. 정확히 반반은 불가능.
- 착한 요괴: 개인차 있으나 음기로 인해 대부분 악함. 가능은 하나 서사적 뒷받침 필수.
- 요괴가 영물 섭취 시: 이야기·양기 흡수 가능. 섭취할수록 강해짐.
- 영물이 요괴 섭취 시: 가능은 하나 혐오 식품 취급. 과복용 비권장.
- 영물 외형: 기본적으로 인간형 100%. 꼬리·귀 등 고유 신체 일부 남기는 경우 있음. 퍼리와는 다름.
- 법기: 자신에게 소중했던 물건·잊고 싶지 않은 이야기와 관련된 물건을 실체화. 인챈트 개념. 1령당 보통 1개, 최대 2~3개. 자신과 무관한 물건은 사용 불가.
  · 전투형: 검·창·활·채찍·지팡이·총기·부적·단검·반지·안경·신체 자체 등.
  · 비전투형: 나침반 반지·시야강화 안경·자동청소 빗자루 등. 전투·비전투 용도 자유.
  · 랭크: C(평범) / B(평균) / A(술식급) / EX(규격 외·의식급). 위력 단위: 대령·대역·대국급.
  · 대령(對靈): 1대1 특화. 한 명에게 집중 피해. 영력 소비 적음. 여러 지문 모으면 드물게 대국급 도달 가능.
  · 대역(對域): 다수·일정 범위 동시 공격 가능. 영력 소모 커서 남발 불가. 결계·방어·버프형도 대역 포함.
  · 대국(對國): 요새급 건축물도 일격에 파괴. 막대한 영력 소모+긴 집중 시간 필요. 한 번 쓰면 전투 종결. 범위 또한 광역.

[세력: 중앙(프람)]
- 영물세계 정부. "도시의 눈". 아리아 프람 타워에 본부.
- 직종: 판관(대표, NPC 전용) / 차사(치안·요괴 퇴치) / 방사(법기·술식 제작) / 선녀(행정·복지) / 신령(육신세계 영혼 관리)
- 요괴는 중앙 소속 불가. 중앙 소속 술식 대부분은 중앙이 제작.
- 가문과 표면 휴전 중이나 법 닿지 않는 곳에선 은밀한 살육전 진행 중.

[세력: 가문]
- 뜻을 같이하는 영물들의 공동체. "도시의 손". 귀족 역할.
- 사신수 가문(4대): 청룡(식물 담당)·백호(육상생물 담당)·주작(비행생물 담당)·현무(수생생물 담당).
- 사슴(기린) 부부가 전체 통솔 (플레이어블 X).
- 12지가: 쥐·소·호랑이·토끼·뱀·용·말·양·원숭이·닭·개·돼지 가문.
- 술식 역사가 깊을수록 강해짐. 가문마다 고유 술식 보유.
- 필요에 따라 요괴와 손잡기도 함.

[달빛여관]
- 죽은 망자들이 처음 발을 내딛는 중립 안식처. 아리아 숲속 위치.
- 소 가문(홀스타인) 운영. 요괴·영물 모두 받음.
- 주인 하루: 130살 소 영물. 흑발 흰얼룩 장발. 파란 눈. 왼쪽 뿔 없음(법기로 사용). 천문술 계승자. 황도 12궁 술식 사용. 장난기 많고 친근하나 여관 안에선 절대적 권위. 동생 이레는 현재 장기 여행 중. 항상 뭔가 씹고 있음(깨 뻥튀기·타코야키 젤리 등).
- 하루 주요 술식: 조디악 스피킹(별빛 낙탄), 밀키 웨이(흡수 장막), 싱귤러 포인트(여관 내 능력 무효화), 이벤트 호라이즌(시야 차단).
- 1층: 카운터·달빛 정원·매점·식당·온천탕. 지하: 설(說)의 도서관(기초지식 제공). 3층 옥상: 노천탕·프라이빗 객실.

[대륙: 판테라]
- 영물이 가장 많이 거주하는 대륙. 중앙·청룡·현무 영향권.
- 아리아: 유일한 21세기 현대 도시. 중앙 본부 프람 타워(지하 비밀). 구 프람 폐허 지구(반기계 실험체·무법지대).
- 아발론: 청룡 도시. 자연 친화. 식물계 영물 거주.
- 아틀란티스: 현무 도시. 음기 가득. 해저도시·수상도시 복합. 수생생물 거주.

[아틀란티스 — 느와르]
- 아틀란티스 실질 수도. 심해 도시. 수정 돔·산호벽·심해석으로 건설.
- 수장: 묵현(현무). 흑발·먹빛 눈동자·창백한 피부. 수천 년 이상 생존. 극도로 말 없고 냉정하나 도시를 진심으로 아낌. 도시 전체에 감지망 보유. 계약의 홀에서 혼을 저당잡는 계약 진행.
- 주요 구역: 칠흑궁(묵현 거처·영의 연못·봉인 감옥·계약의 홀) / 흘러내린 구역(주거지·해파리 정원·고래등 수산시장·흑류 선착장) / 만해지(요괴 자율구역, 요괴법 5조 운영) / 흑진주 도서관(물방울 문서 체험) / 해기술 실험동 / 음지 구역(800년 전 집단 변천 사건, 출입 금지).
- 봉인 감옥: 제7감방(인어 노래 봉인), 제13감방(800년 전 유일 생존자 자발 수감), 최심층(형태 없는 봉인).
- 느와르 낮=푸른빛 조용, 밤=붉은빛 활기·만해지 문 열림·암거래 활성화.
- 주요 NPC: 연아(문어 영물·도서관 수석기록관) / 나찰(심해 상어 요괴·만해지 우두머리·왼눈 없음) / 파람(전기뱀장어 영물·해기술 장인장·쾌활함).
- 계약의 홀 규칙: 자유의지 필수. 이행하면 혼 돌아옴. 미이행 시 이야기 조각 묵현에게 영구 귀속. 혼 잃으면 술식 약화·기억 흐려짐.

[대륙: 다오렌]
- 남쪽. 불과 여름의 기운. 주작 영향권. 양기 강해 요괴가 약해지는 땅.
- 엘도라도: 주작 도시. 부속 섬은 휴양지. 본섬은 최고 60도.
- 수장: 홍연(주작). 5000살. 붉은 장발. 180cm. 참새 영물. 술식 체계 창시자. 느긋하고 철학적이나 다오렌 위협 시 본색 드러냄. 튤립·술 좋아함. 추운 곳 극혐.
- 도개사: 영물세계 최대 무역시장. 겉의 시장(합법)·속의 시장(암거래) 공존. 암시장 NPC: 회사(전갈 영물·운영자·사무적), 나비진(나비 영물·정보상·정보로 값 치름), 철흑(두더지 영물·금지 법기 거래·왼팔 없음).
- 염화가: 예술·패션 구역. 화풍연의상단(연의 4계열: 홍염·사화·연정·귀화) 운영. 창시자 염비화(전직 선녀).
- 구역: 연의로(대로·축제) / 백염정(온천·향·귀족 구역) / 흑화로(밤의 암거래·각인술·검붉은 장미 문양).

[대륙: 레퀸]
- 서쪽. 가을 기운. 축복받은 대륙. 백호 영향권.
- 무(武): 주요 도시. 무공·상공업 중심. 천호산 산기슭.
- 백호 가문 현재 가주 공석: 초대 가주 설백이 권산하령 북쪽 순찰 후 실종. 법기만 북단 절벽에서 발견. 가신단 합의제로 운영 중. 차기 가주 파벌 갈등.
- 도철(饕餮): 레퀸 북쪽 거주 최강 요괴. 신화 속 탐욕의 짐승에서 태어난 요괴. 강한 자와 싸우는 것으로 허기 억제. 생사결 문화에 진심. 설백 실종에 대해 "더 깊은 곳에 갔다"고만 말함.
- 북쪽 지형: 몰운령(안개 산맥) / 한백야(동토 평원) / 단애(최북단 절벽·설백 법기 발견지).
- 레퀸 문화: 일구음주종투(설화주 검은 잔으로 생사결 신청) / 전사 무구를 으뜸 유품으로 치는 장례 문화.

[달빛여관 주요 NPC 상세]
- 새로 온 령(기억 상실): 이름도 과거도 없이 달빛여관 앞에 서 있는 존재. 이야기는 있으나 기억을 잃음. 누가 가져갔는지 스스로 버렸는지 불명. 하루는 "이야기는 있는데 이름을 잃은 경우"라고 설명. 이 캐릭터와 대화할 때 기억 상실 컨셉을 유지하며 조금씩 단서를 풀어갈 것.
- 하루🐄: 130살 소 영물. 흑발 장발(흰얼룩). 파란 눈. 오른쪽 황금 뿔 하나(왼쪽은 법기). 흰 치파오+흰 꽃 머리장식. 뻥튀기·타코야키 젤리 항상 씹고 있음. 장난기 많지만 여관 안에서 절대 권위.
- 뮤뮤🐙: 33살 문어 영물. 파란 피부·파란 머리·파란 촉수. 172cm. 도도한 미인+상어 이빨 웃음. 아틀란티스 출신. 법기: 2m 닻(아가씨와 바다). 술식: 먹물 뱉기. 피자 애호가. 폭발음 극혐. 진상 처리 담당.
- 로한🐍: 35살 뱀 영물. 적발·황금 세로동공. 175cm. 흰 셔츠. 전투 능력 없음. 매점 주인. 느긋하나 진상 앞에선 눈빛 달라짐. 혀 날름(무의식). "싸울 일 생기면 뮤뮤 부르면 되죠".
- 모련🐾: 14살 삵(아무르삵) 영물. 흑발+끝 회색. 169cm. 설악산 최상위 포식자. 수리부엉이에 희생. 말 없고 무뚝뚝. 이쁜 아가씨 보면 눈빛 달라짐. 찝적 수컷에게 공격적. 호텔리어(룸서비스). 신체강화 특화.
- 쫑🐹(종식): 나이 비밀(햄스터 기준 80세↑). 펄햄스터 영물. 영물형 10cm/인간형 155cm 흰 머리. 요리사. 마들렌 장인. 이름 물어보면 문다 경고 없이. 까마귀 극혐. 볼에 간식 저장 습관.
- 윤 의현🐯: 240살 호랑이 영물. 182cm. 홍수 둑을 몸으로 막아 마을 구하고 생을 마감. 사서. 느긋하고 고풍스러운 말투. 타인 책임감 중시하나 본인 책임지는 건 귀찮아함. 술식: 데미지 보정(패시브).
- 박청🐉(薄淸): 1278살 잉어 가문 가주·청룡. 162cm. 오팔처럼 일렁이는 다색 머리칼. 겉은 고풍스러운 가주, 속엔 어린아이다운 면 숨김. 단 것 좋아함. 가문 영물 모두 진심으로 아낌. 남편을 잃은 공허함을 안고 살아감. 집착과 상실의 서사.

[규칙]
1. 나레이션 먼저, NPC 대사 뒤에. 간결하고 몰입감 있게.
2. 답변 끝 선택지 JSON 필수: {"choices":[{"icon":"이모지","text":"내용"},{"icon":"이모지","text":"내용"},{"icon":"이모지","text":"내용"}]}
3. 씬 변화시: {"scene":"inn|forest|city|dark|moon|fight|ocean|desert","title":"장소명"} 포함
4. 겉은 따뜻하지만 이면엔 비밀과 긴장. 세계관 내 설정을 정확히 반영할 것.
5. 하루는 장난기 있고 친근하되 여관 내 규칙엔 단호함. 달빛여관 안에서는 어떤 존재도 싸울 수 없음(싱귤러 포인트).`;

function showCharSelect(){
  document.getElementById('start-screen').style.display='none';
  document.getElementById('char-select').classList.remove('hidden');
  loadImg(document.getElementById('char-hdr-img'),IMGS.charHdr);
  const list=document.getElementById('char-list');
  list.innerHTML='';
  Object.entries(CHARS).forEach(([key,c])=>{
    const card=document.createElement('div');
    card.className='char-card';
    card.onclick=()=>startStory(key);
    card.innerHTML=`<div class="char-thumb"><div class="char-thumb-fb">${c.emoji}</div></div><div class="char-body"><h3>${c.name}</h3><p>${c.desc}</p><span class="char-tag ${c.tagClass}">${c.tag}</span></div>`;
    list.appendChild(card);
  });
}

async function startStory(charKey){
  gameState.character=charKey;
  document.getElementById('char-select').classList.add('hidden');
  const c=CHARS[charKey];
  document.getElementById('hdr-char').textContent=c.emoji+' '+c.name;

  // 오프라인 프롤로그 데이터
  const PROLOGUE = {
    newcomer: [
      {type:'narr', text:'눈을 떴다.\n아무것도 없다. 이름도, 얼굴도, 어제도.\n\n다만 확실한 건 하나—\n내가 여기 있다는 것.'},
      {type:'narr', text:'울창한 숲 사이로 불빛이 보인다.\n어떻게 여기 왔는지 모른다.\n그냥 눈을 떴을 때 문 앞에 서 있었다.\n\n달빛여관 (達光旅館).'},
      {type:'npc', name:'하루', emoji:'🐄', text:'어서 와. 이름이 뭐야?'},
      {type:'npc', name:'하루', emoji:'🐄', text:'...응, 그럴 줄 알았어.\n가끔 그런 경우 있거든.\n이야기는 있는데 이름을 잃은 사람.\n\n뭐, 들어와. 차 마시면서 얘기하자.'},
    ],
    hunter: [
      {type:'narr', text:'프람 타워에서 내려온 지령서.\n임무: 달빛여관 인근 미확인 요괴 추적.'},
      {type:'narr', text:'지령서 뒤편 작은 메모가 신경 쓰인다.\n\'구 프람 관련 증인 확보.\'\n\n이건 공식 임무가 아니다.'},
      {type:'narr', text:'달빛여관 문 앞.\n안에서 웃음소리가 들린다.\n\n요괴 냄새도 난다— 꽤 강하다.'},
      {type:'npc', name:'하루', emoji:'🐄', text:'어머, 차사 왔네. 뭔 일이야?\n얼굴이 좀 굳어있는데.'},
    ],
    youkai: [
      {type:'narr', text:'허기가 밀려온다.\n마지막으로 먹은 게 언제인지 기억도 안 난다.'},
      {type:'narr', text:'영물로 위장한 채 달빛여관에 들어왔다.\n이곳은 중립지대—\n주인의 힘이 미치는 동안엔 안전하다.\n\n문제는 얼마나 버틸 수 있느냐다.'},
      {type:'npc', name:'하루', emoji:'🐄', text:'...냄새 숨기는 거 꽤 잘하네.\n그래도 나한텐 안 통해.'},
      {type:'npc', name:'하루', emoji:'🐄', text:'뭐, 상관없어. 여관 안에서 선 안 넘으면 돼.\n들어와.'},
    ],
    clan: [
      {type:'narr', text:'가문의 서신이 도착했다.\n달빛여관에서 가문의 행방불명된 영물이\n마지막으로 목격됐다고.'},
      {type:'narr', text:'중앙 차사들의 시선을 피하며\n아리아까지 왔다.\n\n숲 사이로 달빛여관이 보인다.'},
      {type:'narr', text:'달빛여관 정원.\n차를 마시던 영물이 고개를 든다.'},
      {type:'npc', name:'하루', emoji:'🐄', text:'가문 영물이구나.\n찾는 사람 있어?\n\n...들어와. 차 마시면서 얘기해.'},
    ],
    leqin: [
      {type:'narr', text:'레퀸을 떠나온 지 며칠이 지났다.\n권산하령을 넘어 아리아까지— 긴 여정이었다.'},
      {type:'narr', text:'가문의 어른들은 설백 가주가 그냥 사라진 거라고 했다.\n하지만 도철의 말이 머릿속을 맴돈다.\n\n"그 자는 더 깊은 곳에 갔다."'},
      {type:'narr', text:'단서를 찾으러 아리아로 왔다.\n달빛여관이 마지막 목격지라고 했다.'},
      {type:'npc', name:'하루', emoji:'🐄', text:'레퀸에서 왔구나. 멀리 왔네.\n설백 찾는 거야?\n\n...들어와. 아는 게 있을 수도 있어.'},
    ],
    atlantis: [
      {type:'narr', text:'느와르의 물빛이 그립다.\n흑류 선착장의 승강기를 타고 지상으로 올라온 건 처음이었다.'},
      {type:'narr', text:'묵현이 말했다.\n달빛여관의 주인을 만나라고.\n이유는 말하지 않았다.\n\n묵현이 이유를 말하지 않을 때는,\n항상 중요한 일이었다.'},
      {type:'narr', text:'숲 속 달빛여관 앞.\n생각보다 아늑한 곳이다.'},
      {type:'npc', name:'하루', emoji:'🐄', text:'느와르 출신이구나.\n묵현이 보냈어?\n\n...그럴 줄 알았어. 들어와.'},
    ],
  };

  const scenes = PROLOGUE[charKey] || PROLOGUE.newcomer;

  // 씬 순서대로 표시
  for(const scene of scenes){
    await delay(500);
    if(scene.type==='narr'){
      addNarrator(scene.text);
    } else if(scene.type==='npc'){
      addNPC(scene.name, scene.emoji, scene.text);
    }
    await delay(1200);
  }

  // AI 연결 안내 버튼 표시
  await delay(600);
  showOfflineEnd();

function showOfflineEnd(){
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg narrator';
  div.innerHTML = `<div class="bubble" style="border:1px solid rgba(232,213,163,.25);background:rgba(232,213,163,.06);">
    ✦ 프롤로그가 끝났어요.<br><br>
    이어지는 이야기는 <b>인터넷 연결</b>이 필요해요.<br>
    연결 후 아래 버튼을 눌러주세요.
    <div style="margin-top:12px">
      <button onclick="continueWithAI()" style="background:var(--jade);color:white;border:none;border-radius:8px;padding:9px 20px;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;">
        ✦ AI와 이야기 이어가기
      </button>
    </div>
  </div>`;
  chat.appendChild(div);
  scrollChat();
}

async function continueWithAI(){
  const c=CHARS[gameState.character];
  updateScene('inn','달빛여관 — 입구','제1장');
  showTyping();
  await delay(1800);
  removeTyping();
  await callAI(`캐릭터: ${c.name}\n프롤로그 이후 달빛여관 안으로 들어오는 장면. 하루(소 영물, 흑발 흰얼룩 장발, 파란 눈, 왼쪽 뿔 없음, 뭔가 씹고 있음)가 여관 내부를 안내하는 장면. 따뜻하지만 뭔가 숨기는 듯한 장난스러운 미소로. 선택지 3개 포함.`,true);
}

function updateScene(key,title,chapter){
  const img=document.getElementById('scene-img');
  img.classList.remove('loaded');
  loadImg(img,IMGS.scenes[key]||IMGS.scenes.inn);
  if(title) document.getElementById('scene-title').textContent=title;
  if(chapter) document.getElementById('scene-chapter').textContent=chapter;
}

function addNarrator(text){
  const d=document.createElement('div');d.className='msg narrator';
  d.innerHTML=`<div class="bubble">${text.replace(/\n/g,'<br>')}</div>`;
  document.getElementById('chat').appendChild(d);scrollChat();
}
function addNPC(name,emoji,text){
  const d=document.createElement('div');d.className='msg npc';
  d.innerHTML=`<div class="avatar">${emoji}</div><div class="bubble-wrap"><div class="sender-name">${name}</div><div class="bubble">${text.replace(/\n/g,'<br>')}</div></div>`;
  document.getElementById('chat').appendChild(d);scrollChat();
}
function addUser(text){
  const c=CHARS[gameState.character];
  const d=document.createElement('div');d.className='msg user';
  d.innerHTML=`<div class="avatar user-av">${c.emoji}</div><div class="bubble-wrap"><div class="sender-name">${c.name}</div><div class="bubble">${text.replace(/\n/g,'<br>')}</div></div>`;
  document.getElementById('chat').appendChild(d);scrollChat();
}
function showTyping(){
  const d=document.createElement('div');d.className='msg npc';d.id='typing-indicator';
  d.innerHTML='<div class="avatar">🏮</div><div class="typing"><span></span><span></span><span></span></div>';
  document.getElementById('chat').appendChild(d);scrollChat();
}
function removeTyping(){document.getElementById('typing-indicator')?.remove();}
function scrollChat(){const c=document.getElementById('chat');setTimeout(()=>c.scrollTop=c.scrollHeight,50);}

function showChoices(choices){
  const el=document.getElementById('choices');
  el.innerHTML='<div class="choice-label">✦ 어떻게 하시겠어요?</div>';
  choices.forEach(c=>{
    const btn=document.createElement('button');btn.className='choice-btn';
    btn.innerHTML=`<span class="cicon">${c.icon}</span>${c.text}`;
    btn.onclick=()=>choiceSelected(c.text);
    el.appendChild(btn);
  });
  el.classList.remove('hidden');
  document.getElementById('input-area').classList.remove('hidden');
}

async function callAI(userMsg,isFirst=false){
  if(!isFirst) gameState.history.push({role:'user',content:userMsg});
  const messages=isFirst?[{role:'user',content:userMsg}]:gameState.history.slice(-14);
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:WORLD_SYSTEM,messages})
    });
    const data=await res.json();
    const raw=data.content?.map(b=>b.text||'').join('')||'';
    const sceneM=raw.match(/\{"scene":"([^"]+)","title":"([^"]+)"\}/);
    if(sceneM) updateScene(sceneM[1],sceneM[2],'제'+(++gameState.chapter)+'장');
    const choiceM=raw.match(/\{"choices":\s*\[[\s\S]*?\]\s*\}/);
    let choices=[];
    let story=raw.replace(sceneM?.[0]||'','').replace(choiceM?.[0]||'','').trim();
    if(choiceM){try{choices=JSON.parse(choiceM[0]).choices||[];}catch(e){}}
    for(const line of story.split('\n').filter(l=>l.trim())){
      const l=line.trim();if(!l)continue;
      if(l.startsWith('*')||l.startsWith('—')||l.startsWith('·')||l.startsWith('[')){
        addNarrator(l.replace(/^\*+|\*+$|^\[|\]$/g,'').trim());await delay(340);
      } else if(/[:：]/.test(l)&&l.search(/[:：]/)<12){
        const ci=l.search(/[:：]/);
        addNPC(l.slice(0,ci).trim(),getSpeakerEmoji(l.slice(0,ci).trim()),l.slice(ci+1).trim());await delay(270);
      } else {addNarrator(l);await delay(270);}
    }
    gameState.history.push({role:'assistant',content:raw});
    if(choices.length>0) showChoices(choices);
  }catch(e){addNarrator('잠시 이야기가 끊겼습니다... 다시 시도해주세요.');}
}

function getSpeakerEmoji(name){
  const m={
    '하루':'🐄','이레':'🌙','뮤뮤':'🐙','모련':'🐾',
    '묵현':'🌑','홍연':'🔥','연아':'🐙','나찰':'🦈',
    '파람':'⚡','회사':'🦂','나비진':'🦋','철흑':'🦔',
    '도철':'👁','설백':'⬜','차사':'⚔️','나레이터':'🏮',
    '로한':'🐍','카에데':'🦊','스즈카제 카에데':'🦊',
    '쫑':'🐹','종식':'🐹','의현':'🐯','윤':'🐯',
    '박청':'🐉','청룡':'🐉','히후미':'🐱','스즈카제 히후미':'🐱',
    '사마진':'🐍','올리비아':'🐷'
  };
  for(const [k,v] of Object.entries(m)) if(name.includes(k)) return v;
  return '💬';
}

async function choiceSelected(text){
  document.getElementById('choices').classList.add('hidden');
  document.getElementById('input-area').classList.add('hidden');
  addUser(text);await delay(350);
  showTyping();await delay(1500+Math.random()*700);removeTyping();
  await callAI(text);
}
async function sendUserMsg(){
  const input=document.getElementById('msg-input');
  const text=input.value.trim();if(!text)return;
  input.value='';autoResize(input);
  document.getElementById('choices').classList.add('hidden');
  document.getElementById('input-area').classList.add('hidden');
  addUser(text);await delay(350);
  showTyping();await delay(1500+Math.random()*500);removeTyping();
  await callAI(text);
}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendUserMsg();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,90)+'px';}
function delay(ms){return new Promise(r=>setTimeout(r,ms));}
</script>

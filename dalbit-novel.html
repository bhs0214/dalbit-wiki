<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>달빛여관 — 이야기</title>
<!-- cache bust -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap');

:root {
  --bg:#0a0806; --surface:#150f0a; --card:#1e1610;
  --border:rgba(232,213,163,0.13); --moon:#e8d5a3; --moon2:#c9a84c;
  --ember:#c9623f; --jade:#4a7c6f; --text:#f0e6d3;
  --text2:rgba(240,230,211,0.6); --text3:rgba(240,230,211,0.28);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;display:flex;justify-content:center;align-items:center;}

#app{width:100%;max-width:430px;height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;}

/* ── 씬 배경 ── */
#scene-bg{
  position:absolute;inset:0;z-index:0;
  transition:background 1.2s ease;
  background:var(--bg);
}
#scene-bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(10,8,6,.3) 0%,rgba(10,8,6,.1) 40%,rgba(10,8,6,.85) 100%);
}

/* 배경 파티클 */
.particles{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
.pt{position:absolute;border-radius:50%;background:var(--moon);opacity:0;animation:ptd linear infinite;}
@keyframes ptd{0%{transform:translateY(100vh);opacity:0;}10%{opacity:.35;}90%{opacity:.1;}100%{transform:translateY(-5vh);opacity:0;}}

/* ── 상단 UI ── */
#top-bar{
  position:relative;z-index:10;
  padding:12px 16px 8px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.top-title{font-family:'Noto Serif KR',serif;font-size:13px;color:var(--moon2);letter-spacing:.1em;}
.top-right{display:flex;gap:8px;}
.icon-btn{
  background:rgba(26,20,16,.6);border:1px solid var(--border);
  border-radius:20px;padding:5px 10px;font-size:11px;
  color:var(--text2);cursor:pointer;transition:all .2s;
  font-family:'Noto Sans KR',sans-serif;
}
.icon-btn:hover{color:var(--moon);border-color:rgba(232,213,163,.3);}

/* 챕터 뱃지 */
#chapter-badge{
  position:relative;z-index:10;
  text-align:center;
  font-size:10px;color:var(--text3);
  letter-spacing:.15em;padding-bottom:4px;
  flex-shrink:0;
}

/* ── 캐릭터 일러스트 영역 ── */
#char-area{
  position:relative;z-index:5;
  flex:1;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:0;pointer-events:none;
  min-height:0;
}
#char-display{
  font-size:clamp(80px,22vw,110px);
  line-height:1;
  animation:charIn .4s ease;
  filter:drop-shadow(0 8px 24px rgba(0,0,0,.6));
  transition:opacity .4s;
}
@keyframes charIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

/* ── 대화창 ── */
#dialog-box{
  position:relative;z-index:10;
  margin:0 12px 10px;
  background:rgba(14,11,8,.88);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
  backdrop-filter:blur(6px);
  flex-shrink:0;
  min-height:110px;
}
#speaker-name{
  font-family:'Noto Serif KR',serif;
  font-size:12px;font-weight:600;
  color:var(--moon);letter-spacing:.06em;
  margin-bottom:8px;
  display:flex;align-items:center;gap:6px;
}
#speaker-name .sn-emoji{font-size:14px;}
#dialog-text{
  font-size:13.5px;line-height:1.8;
  color:var(--text);
  font-family:'Noto Serif KR',serif;
  min-height:48px;
}
#tap-hint{
  text-align:right;font-size:10px;
  color:var(--text3);margin-top:6px;
  animation:blink 1.4s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:.3;}50%{opacity:.8;}}

/* ── 선택지 ── */
#choices-box{
  position:relative;z-index:10;
  margin:0 12px 12px;
  display:flex;flex-direction:column;gap:7px;
  flex-shrink:0;
}
#choices-box.hidden{display:none;}
.choice-btn{
  background:rgba(20,15,10,.82);
  border:1px solid var(--border);
  border-radius:10px;padding:11px 15px;
  font-size:13px;font-family:'Noto Serif KR',serif;
  color:var(--text);cursor:pointer;text-align:left;
  transition:all .18s;
  display:flex;align-items:center;gap:10px;
  backdrop-filter:blur(4px);
  animation:choiceIn .25s ease both;
}
.choice-btn:nth-child(2){animation-delay:.06s;}
.choice-btn:nth-child(3){animation-delay:.12s;}
@keyframes choiceIn{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
.choice-btn:hover{background:rgba(232,213,163,.1);border-color:rgba(232,213,163,.35);color:var(--moon);transform:translateX(4px);}
.choice-icon{font-size:15px;flex-shrink:0;}
.choice-tag{
  margin-left:auto;font-size:10px;flex-shrink:0;
  padding:2px 6px;border-radius:10px;
}
.ct-normal{background:rgba(74,124,111,.15);color:var(--jade);}
.ct-bold{background:rgba(201,98,63,.15);color:var(--ember);}
.ct-wise{background:rgba(232,213,163,.1);color:var(--moon2);}

/* ── 나레이션 오버레이 ── */
#narration{
  position:absolute;inset:0;z-index:20;
  background:rgba(10,8,6,.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 32px;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .6s;
}
#narration.show{opacity:1;pointer-events:auto;}
#narration-text{
  font-family:'Noto Serif KR',serif;
  font-size:14px;line-height:2;color:var(--text2);
  font-style:italic;margin-bottom:28px;
}
#narration-btn{
  background:transparent;border:1px solid var(--border);
  border-radius:20px;padding:9px 24px;
  font-size:12px;color:var(--text3);cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;transition:all .2s;
}
#narration-btn:hover{color:var(--moon);border-color:rgba(232,213,163,.3);}

/* ── 타이틀 화면 ── */
#title-screen{
  position:absolute;inset:0;z-index:30;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 32px;text-align:center;
}
.title-moon{font-size:52px;margin-bottom:20px;animation:mglow 3s ease-in-out infinite;}
@keyframes mglow{0%,100%{filter:drop-shadow(0 0 8px rgba(232,213,163,.3));}50%{filter:drop-shadow(0 0 22px rgba(232,213,163,.8));}}
.title-main{font-family:'Noto Serif KR',serif;font-size:28px;font-weight:700;color:var(--moon);letter-spacing:.15em;margin-bottom:6px;}
.title-sub{font-size:10px;color:var(--text3);letter-spacing:.2em;margin-bottom:28px;}
.title-desc{font-size:12.5px;color:var(--text2);line-height:1.9;font-family:'Noto Serif KR',serif;font-style:italic;margin-bottom:36px;}
.title-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:240px;}
.title-btn{
  background:var(--moon);color:var(--bg);
  border:none;border-radius:24px;padding:12px;
  font-size:13px;font-family:'Noto Serif KR',serif;font-weight:700;
  letter-spacing:.08em;cursor:pointer;transition:all .2s;
}
.title-btn:hover{transform:scale(1.03);box-shadow:0 4px 20px rgba(232,213,163,.25);}
.title-btn.secondary{background:transparent;color:var(--text3);border:1px solid var(--border);}
.title-btn.secondary:hover{color:var(--text);border-color:rgba(232,213,163,.25);}

/* ── 챕터 선택 ── */
#chapter-select{
  position:absolute;inset:0;z-index:29;
  background:var(--bg);overflow-y:auto;
  display:none;
  flex-direction:column;
}
#chapter-select.show{display:flex;}
.cs-header{background:rgba(20,15,10,.95);padding:16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.cs-header h2{font-family:'Noto Serif KR',serif;font-size:16px;color:var(--moon);margin-bottom:3px;}
.cs-header p{font-size:11px;color:var(--text3);}
.cs-list{padding:14px;display:flex;flex-direction:column;gap:8px;}
.cs-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:14px 16px;cursor:pointer;
  transition:all .2s;
}
.cs-card:hover{border-color:rgba(232,213,163,.25);transform:translateX(4px);}
.cs-card.locked{opacity:.4;cursor:not-allowed;}
.cs-card.locked:hover{transform:none;}
.cs-num{font-size:10px;color:var(--text3);letter-spacing:.1em;margin-bottom:4px;}
.cs-title{font-family:'Noto Serif KR',serif;font-size:14px;font-weight:600;margin-bottom:4px;}
.cs-desc{font-size:11.5px;color:var(--text2);line-height:1.5;}
.cs-badge{display:inline-block;font-size:9px;padding:2px 7px;border-radius:10px;margin-top:5px;}
.badge-clear{background:rgba(74,124,111,.15);color:var(--jade);}
.badge-lock{background:rgba(255,255,255,.05);color:var(--text3);}

/* ── 엔딩 화면 ── */
#ending-screen{
  position:absolute;inset:0;z-index:25;
  background:rgba(10,8,6,.96);
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  padding:40px 28px;text-align:center;
}
#ending-screen.show{display:flex;}
.ending-icon{font-size:48px;margin-bottom:16px;}
.ending-type{font-size:10px;color:var(--text3);letter-spacing:.15em;margin-bottom:6px;}
.ending-title{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:700;color:var(--moon);margin-bottom:14px;}
.ending-desc{font-size:13px;color:var(--text2);line-height:1.8;font-family:'Noto Serif KR',serif;font-style:italic;margin-bottom:28px;}
.ending-btns{display:flex;gap:8px;}
.e-btn{
  flex:1;padding:11px;border-radius:10px;border:none;
  font-size:12px;font-family:'Noto Serif KR',serif;
  cursor:pointer;transition:all .2s;
}
.e-btn.primary{background:var(--moon);color:var(--bg);}
.e-btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text2);}

/* 로그 */
#log-screen{
  position:absolute;inset:0;z-index:28;
  background:var(--surface);overflow-y:auto;
  display:none;flex-direction:column;
}
#log-screen.show{display:flex;}
.log-header{
  background:rgba(20,15,10,.98);padding:14px 16px;
  border-bottom:1px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
}
.log-header h3{font-family:'Noto Serif KR',serif;font-size:15px;color:var(--moon);}
.log-close{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;}
.log-body{padding:16px;flex:1;}
.log-entry{margin-bottom:12px;font-size:12.5px;line-height:1.7;color:var(--text2);font-family:'Noto Serif KR',serif;}
.log-entry .log-speaker{color:var(--moon2);font-weight:600;margin-bottom:2px;font-size:11px;}
.log-entry.narr{color:var(--text3);font-style:italic;}
</style>
</head>
<body>

<div id="app">
  <!-- 배경 -->
  <div id="scene-bg"></div>
  <div class="particles" id="particles"></div>

  <!-- 타이틀 -->
  <div id="title-screen">
    <div class="title-moon">🌕</div>
    <div class="title-main">달빛여관</div>
    <div class="title-sub">VISUAL NOVEL · 영물세계 이야기</div>
    <div class="title-desc">
      "달빛이 설(說)을 비출 때<br>영물들은 피어난다."<br><br>
      이야기는 당신의 선택으로 흘러갑니다.
    </div>
    <div class="title-btns">
      <button class="title-btn" onclick="startNew()">✦ 이야기 시작</button>
      <button class="title-btn secondary" id="novel-continue-btn" onclick="continueNovel()" style="display:none">↻ 이어하기</button>
      <button class="title-btn secondary" onclick="showChapterSelect()">챕터 선택</button>
    </div>
  </div>

  <!-- 챕터 선택 -->
  <div id="chapter-select">
    <div class="cs-header">
      <h2>챕터 선택</h2>
      <p>클리어한 챕터로 이동할 수 있습니다</p>
    </div>
    <div class="cs-list" id="cs-list"></div>
  </div>

  <!-- 게임 UI -->
  <div id="top-bar">
    <div class="top-title">🏮 달빛여관</div>
    <div class="top-right">
      <button class="icon-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
      <button class="icon-btn" id="speed-btn" onclick="cycleSpeed()">속도·보통</button>
      <button class="icon-btn" onclick="showLog()">기록</button>
      <button class="icon-btn" onclick="showTitle()">타이틀</button>
    </div>
  </div>
  <div id="chapter-badge">프롤로그</div>
  <div id="char-area"><div id="char-display">🌕</div></div>
  <div id="dialog-box" onclick="nextLine()">
    <div id="speaker-name"><span class="sn-emoji"></span><span id="sn-text"></span></div>
    <div id="dialog-text"></div>
    <div id="tap-hint">▼ 탭하여 계속</div>
  </div>
  <div id="choices-box" class="hidden"></div>

  <!-- 나레이션 오버레이 -->
  <div id="narration">
    <div id="narration-text"></div>
    <button id="narration-btn" onclick="closeNarration()">계속 ▶</button>
  </div>

  <!-- 엔딩 화면 -->
  <div id="ending-screen">
    <div class="ending-icon" id="ending-icon"></div>
    <div class="ending-type" id="ending-type"></div>
    <div class="ending-title" id="ending-title"></div>
    <div class="ending-desc" id="ending-desc"></div>
    <div class="ending-btns">
      <button class="e-btn secondary" onclick="showChapterSelect()">챕터 선택</button>
      <button class="e-btn primary" onclick="showTitle()">타이틀로</button>
    </div>
  </div>

  <!-- 로그 -->
  <div id="log-screen">
    <div class="log-header">
      <h3>📜 대화 기록</h3>
      <button class="log-close" onclick="hideLog()">✕</button>
    </div>
    <div class="log-body" id="log-body"></div>
  </div>
</div>

<script>
// ── 파티클 동적 교체 ──
function updateParticles(bgKey) {
  const pe = document.getElementById('particles');
  pe.innerHTML = '';
  const cfg = BG_PARTICLES[bgKey] || BG_PARTICLES.night_inn;
  for(let i = 0; i < cfg.count; i++){
    const p = document.createElement('div');
    p.className = 'pt';
    const size = cfg.size[0] + Math.random() * (cfg.size[1] - cfg.size[0]);
    p.style.cssText = `left:${Math.random()*100}%;width:${size}px;height:${size}px;background:${cfg.color};animation-duration:${10+Math.random()*14}s;animation-delay:${Math.random()*14}s`;
    pe.appendChild(p);
  }
}

// ── 배경 묘사 텍스트 표시 ──
function showBgDesc(bgKey) {
  const desc = BG_DESC[bgKey];
  if (!desc) return;
  let el = document.getElementById('bg-desc');
  if (!el) {
    el = document.createElement('div');
    el.id = 'bg-desc';
    el.style.cssText = `position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:8;font-family:'Noto Serif KR',serif;font-size:10px;color:rgba(240,230,211,0.35);letter-spacing:.1em;white-space:nowrap;pointer-events:none;transition:opacity .8s;font-style:italic;`;
    document.getElementById('app').appendChild(el);
  }
  el.style.opacity = '0';
  el.textContent = desc;
  setTimeout(() => { el.style.opacity = '1'; }, 300);
  setTimeout(() => { el.style.opacity = '0'; }, 3000);
}

// ── 스킬 이펙트 시스템 ──
function skillEffect(type) {
  const app = document.getElementById('app');
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:absolute;inset:0;z-index:18;pointer-events:none;';

  if(type === 'zodiac') {
    // 하루의 황도 12궁 — 별자리 파티클
    overlay.innerHTML = '';
    const symbols = ['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'];
    symbols.forEach((s, i) => {
      const span = document.createElement('span');
      const angle = (i / 12) * Math.PI * 2;
      const r = 35 + Math.random() * 20;
      const x = 50 + r * Math.cos(angle);
      const y = 50 + r * Math.sin(angle) * 0.6;
      span.style.cssText = `position:absolute;left:${x}%;top:${y}%;font-size:${11+Math.random()*6}px;color:rgba(201,168,76,${0.4+Math.random()*0.5});transform:translate(-50%,-50%);animation:zodiacPulse .8s ease both;animation-delay:${i*0.06}s`;
      span.textContent = s;
      overlay.appendChild(span);
    });
    // 연결선 효과
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 100 100');
    svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;opacity:.3;';
    overlay.appendChild(svg);

  } else if(type === 'dark_wave') {
    // 묵현의 영력 — 어두운 파동
    for(let i = 0; i < 4; i++){
      const ring = document.createElement('div');
      ring.style.cssText = `position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1.5px solid rgba(68,102,170,0.6);animation:darkRing 1.2s ease-out both;animation-delay:${i*0.2}s;`;
      overlay.appendChild(ring);
    }

  } else if(type === 'shadow_shake') {
    // 이야기를 먹는 것 — 화면 흔들림 + 어둠
    overlay.style.cssText += 'background:rgba(5,3,3,0);animation:shadowFlash .6s ease;';

  } else if(type === 'fan_ki') {
    // 뮤뮤의 팬던트 — 하늘색 빛
    for(let i = 0; i < 8; i++){
      const line = document.createElement('div');
      const angle = (i / 8) * 360;
      line.style.cssText = `position:absolute;left:50%;top:50%;width:2px;height:${20+Math.random()*30}%;background:linear-gradient(to top,rgba(100,180,255,0.6),transparent);transform-origin:bottom center;transform:translateX(-50%) rotate(${angle}deg);animation:fanLine .5s ease-out both;animation-delay:${i*0.04}s;`;
      overlay.appendChild(line);
    }

  } else if(type === 'ember_flame') {
    // 하루의 황도 — 불꽃 파티클
    for(let i = 0; i < 18; i++){
      const p = document.createElement('div');
      p.style.cssText = `position:absolute;left:${30+Math.random()*40}%;top:${40+Math.random()*30}%;width:${2+Math.random()*4}px;height:${2+Math.random()*4}px;border-radius:50%;background:rgba(201,168,76,${0.5+Math.random()*0.5});animation:emberFloat ${0.6+Math.random()*0.8}s ease-out both;animation-delay:${Math.random()*0.3}s;`;
      overlay.appendChild(p);
    }
  }

  app.appendChild(overlay);
  setTimeout(() => { if(overlay.parentNode) overlay.remove(); }, 2000);
}

// 스킬 이펙트 CSS 키프레임 동적 추가
const effectStyle = document.createElement('style');
effectStyle.textContent = `
@keyframes zodiacPulse {
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4);}
  60%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}
  100%{opacity:.7;transform:translate(-50%,-50%) scale(1);}
}
@keyframes darkRing {
  0%{width:20px;height:20px;opacity:.8;}
  100%{width:200px;height:200px;opacity:0;}
}
@keyframes shadowFlash {
  0%{background:rgba(5,3,3,0);}
  30%{background:rgba(5,3,3,.7);}
  60%{background:rgba(5,3,3,.3);}
  100%{background:rgba(5,3,3,0);}
}
@keyframes fanLine {
  0%{opacity:0;height:0;}
  50%{opacity:1;}
  100%{opacity:0;}
}
@keyframes emberFloat {
  0%{opacity:1;transform:translateY(0) scale(1);}
  100%{opacity:0;transform:translateY(-40px) scale(.3);}
}
`;

// ── 배경 색상 맵 ──
const BG_COLORS = {
  night_inn: 'radial-gradient(ellipse at 30% 20%, #1a0f2e 0%, #0d0820 40%, #0a0806 70%)',

// ── 사운드 시스템 (간소화) ──
let audioCtx = null;
let bgmGain = null;
let bgmNodes = [];
let sfxGain = null;
let isMuted = false;

function initAudio() {
  try {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    bgmGain = audioCtx.createGain();
    bgmGain.gain.value = 0.15;
    bgmGain.connect(audioCtx.destination);
    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = 0.4;
    sfxGain.connect(audioCtx.destination);
  } catch(e) { console.log('오디오 초기화 실패:', e); }
}

function toggleMute() {
  isMuted = !isMuted;
  if (bgmGain) bgmGain.gain.value = isMuted ? 0 : 0.15;
  if (sfxGain) sfxGain.gain.value = isMuted ? 0 : 0.4;
  const btn = document.getElementById('mute-btn');
  if (btn) btn.textContent = isMuted ? '🔇' : '🔊';
}

function stopBGM() {
  bgmNodes.forEach(n => { try { n.stop(); } catch(e){} });
  bgmNodes = [];
}

function playBGM(type) {
  try {
    if (!audioCtx || isMuted) return;
    stopBGM();
    if (type === 'inn') playInnBGM();
    else if (type === 'tense') playTenseBGM();
    else if (type === 'ocean') playOceanBGM();
  } catch(e) {}
}

function playInnBGM() {
  try {
    const notes = [261.6, 329.6, 392, 523.2, 659.3, 523.2, 392, 329.6];
    const times = [0, 0.6, 1.2, 1.8, 2.4, 3.0, 3.6, 4.2];
    const loop = 4.8;
    for (let rep = 0; rep < 20; rep++) {
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0, audioCtx.currentTime + rep*loop + times[i]);
        g.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + rep*loop + times[i] + 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + rep*loop + times[i] + 0.5);
        osc.connect(g); g.connect(bgmGain);
        osc.start(audioCtx.currentTime + rep*loop + times[i]);
        osc.stop(audioCtx.currentTime + rep*loop + times[i] + 0.6);
        bgmNodes.push(osc);
      });
    }
  } catch(e) {}
}

function playTenseBGM() {
  try {
    [82.4, 87.3].forEach(freq => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain(); g.gain.value = 0.04;
      o.type = 'sine'; o.frequency.value = freq;
      o.connect(g); g.connect(bgmGain);
      o.start(); bgmNodes.push(o);
    });
  } catch(e) {}
}

function playOceanBGM() {
  try {
    [130.8, 164.8].forEach(freq => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain(); g.gain.value = 0.04;
      o.type = 'sine'; o.frequency.value = freq;
      o.connect(g); g.connect(bgmGain);
      o.start(); bgmNodes.push(o);
    });
  } catch(e) {}
}

function sfx(type) {
  try {
    if (!audioCtx || isMuted) return;
    if (type === 'page' || type === 'click') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 660;
      g.gain.setValueAtTime(0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      o.connect(g); g.connect(sfxGain);
      o.start(); o.stop(audioCtx.currentTime + 0.12);
    } else if (type === 'choice') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 523;
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      o.connect(g); g.connect(sfxGain);
      o.start(); o.stop(audioCtx.currentTime + 0.18);
    } else if (type === 'ending') {
      [523.2, 659.3, 783.9].forEach((f, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.18, audioCtx.currentTime + i*0.2);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i*0.2 + 0.7);
        o.connect(g); g.connect(sfxGain);
        o.start(audioCtx.currentTime + i*0.2);
        o.stop(audioCtx.currentTime + i*0.2 + 0.8);
      });
    }
  } catch(e) {}
}

// ── 챕터 정보 ──
const CHAPTERS = [
  { id: 'ch1', title: '제1장 — 달빛 아래의 첫 밤', desc: '달빛여관에 처음 도착한 날의 이야기.', startNode: 'ch1_start' },
  { id: 'ch2', title: '제2장 — 요괴의 냄새', desc: '여관에 이상한 투숙객이 찾아온다.', startNode: 'ch2_start' },
  { id: 'ch3', title: '제3장 — 느와르의 편지', desc: '심해도시에서 온 편지와 오래된 비밀.', startNode: 'ch3_start' },
  { id: 'ch4', title: '제4장 — 음지 구역의 목소리', desc: '800년 전 그날의 진실을 찾아 음지 구역으로.', startNode: 'ch4_start' },
];

// ── 상태 ──
let currentNode = null;
let dialogQueue = [];
let isTyping = false;
let fullText = '';
let displayText = '';
let typingTimer = null;
let gameLog = [];
let cleared = JSON.parse(localStorage.getItem('dalbit-novel-cleared')||'{}');

// ── 자동 저장 (이어하기) ──
const NOVEL_SAVE_KEY = 'dalbit-novel-save';
function saveNovelProgress(nodeId) {
  try { localStorage.setItem(NOVEL_SAVE_KEY, nodeId); } catch(e) {}
}
function clearNovelProgress() {
  try { localStorage.removeItem(NOVEL_SAVE_KEY); } catch(e) {}
}
(function initNovelContinue(){
  const saved = localStorage.getItem(NOVEL_SAVE_KEY);
  if (saved && STORY[saved]) {
    document.getElementById('novel-continue-btn').style.display = 'inline-block';
  }
})();
function continueNovel() {
  const saved = localStorage.getItem(NOVEL_SAVE_KEY);
  if (!saved || !STORY[saved]) { startNew(); return; }
  initAudio();
  document.getElementById('title-screen').style.display = 'none';
  loadNode(saved);
}

// ── 텍스트 속도 (보통 → 빠름 → 즉시) ──
const SPEEDS = [
  { label: '속도·보통', ms: 28 },
  { label: '속도·빠름', ms: 12 },
  { label: '속도·즉시', ms: 0 },
];
let speedIdx = parseInt(localStorage.getItem('dalbit-novel-speed') || '0');
if (isNaN(speedIdx) || speedIdx < 0 || speedIdx >= SPEEDS.length) speedIdx = 0;
document.getElementById('speed-btn').textContent = SPEEDS[speedIdx].label;
function cycleSpeed() {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  try { localStorage.setItem('dalbit-novel-speed', String(speedIdx)); } catch(e) {}
  document.getElementById('speed-btn').textContent = SPEEDS[speedIdx].label;
}

// ── 시작 ──
function startNew() {
  initAudio();
  clearNovelProgress();
  document.getElementById('title-screen').style.display = 'none';
  loadNode('ch1_start');
}

function showChapterSelect() {
  document.getElementById('title-screen').style.display = 'none';
  const cs = document.getElementById('chapter-select');
  cs.classList.add('show');
  const list = document.getElementById('cs-list');
  list.innerHTML = CHAPTERS.map((c, i) => {
    const isFirst = i === 0;
    const prevCleared = i === 0 || cleared[CHAPTERS[i-1].id];
    const isLocked = !isFirst && !prevCleared;
    return `<div class="cs-card${isLocked?' locked':''}" onclick="${isLocked?'':'startChapter(\''+c.startNode+'\')'}">
      <div class="cs-num">CHAPTER ${i+1}</div>
      <div class="cs-title">${c.title}</div>
      <div class="cs-desc">${c.desc}</div>
      <span class="cs-badge ${cleared[c.id]?'badge-clear':'badge-lock'}">${cleared[c.id]?'✓ 클리어':'🔒 잠김'}</span>
    </div>`;
  }).join('');
}

function startChapter(nodeId) {
  initAudio();
  document.getElementById('chapter-select').classList.remove('show');
  loadNode(nodeId);
}

function showTitle() {
  document.getElementById('ending-screen').classList.remove('show');
  document.getElementById('title-screen').style.display = 'flex';
  document.getElementById('chapter-select').classList.remove('show');
}

// ── 노드 로드 ──
let prevBg = null;
function loadNode(nodeId) {
  const node = STORY[nodeId];
  if (!node) return;
  currentNode = nodeId;
  saveNovelProgress(nodeId);

  // 배경
  const bg = BG_COLORS[node.bg] || BG_COLORS.dark;
  document.getElementById('scene-bg').style.background = bg;

  // bg 바뀔 때만 파티클 + 배경 묘사 업데이트
  if (node.bg && node.bg !== prevBg) {
    updateParticles(node.bg);
    showBgDesc(node.bg);
    prevBg = node.bg;
  }

  // 스킬 이펙트
  if (node.effect) skillEffect(node.effect);

  // effectStyle 문서에 추가 (최초 1회)
  if (!document.getElementById('effect-style')) {
    effectStyle.id = 'effect-style';
    document.head.appendChild(effectStyle);
  }

  // BGM 전환
  if (audioCtx) {
    if (node.bg === 'night_inn' || node.bg === 'forest' || node.bg === 'dawn') playBGM('inn');
    else if (node.bg === 'dark' || node.bg === 'deep') playBGM('tense');
    else if (node.bg === 'ocean') playBGM('ocean');
    sfx('page');
  }

  // 챕터 뱃지
  if (nodeId.startsWith('ch1')) document.getElementById('chapter-badge').textContent = '제1장 — 달빛여관의 문';
  else if (nodeId.startsWith('ch2')) document.getElementById('chapter-badge').textContent = '제2장 — 요괴의 냄새';
  else if (nodeId.startsWith('ch3')) document.getElementById('chapter-badge').textContent = '제3장 — 느와르의 편지';
  else if (nodeId.startsWith('ch4')) document.getElementById('chapter-badge').textContent = '제4장 — 음지 구역의 목소리';

  // 캐릭터
  if (node.char) {
    const cd = document.getElementById('char-display');
    cd.style.opacity = '0';
    setTimeout(() => { cd.textContent = node.char; cd.style.opacity = '1'; }, 200);
  }

  // 엔딩
  if (node.ending) {
    setTimeout(() => showEnding(node.ending), 800);
    return;
  }

  // 나레이션
  if (node.narration) {
    showNarration(node.narration, () => {
      if (node.next) loadNode(node.next);
    });
    return;
  }

  // 선택지
  if (node.choices) {
    document.getElementById('dialog-box').style.display = 'none';
    showChoices(node.choices);
    return;
  }

  // 대화
  document.getElementById('dialog-box').style.display = 'block';
  document.getElementById('choices-box').classList.add('hidden');
  document.getElementById('tap-hint').style.display = 'block';

  const sn = document.getElementById('speaker-name');
  const snEmoji = sn.querySelector('.sn-emoji');
  const snText = document.getElementById('sn-text');

  if (node.speaker) {
    sn.style.display = 'flex';
    snEmoji.textContent = node.speakerEmoji || '';
    snText.textContent = node.speaker;
  } else {
    sn.style.display = 'none';
  }

  // 로그 추가
  if (node.text) {
    gameLog.push({ speaker: node.speaker || '', text: node.text, isNarr: !node.speaker });
  }

  typeText(node.text || '', node.next);
}

function typeText(text, nextNode) {
  clearTimeout(typingTimer);
  fullText = text;
  displayText = '';
  isTyping = true;
  const el = document.getElementById('dialog-text');
  let i = 0;

  function tick() {
    const ms = SPEEDS[speedIdx].ms;
    if (ms === 0) { i = fullText.length; displayText = fullText; el.textContent = fullText; }
    if (i < fullText.length) {
      displayText += fullText[i++];
      el.textContent = displayText;
      typingTimer = setTimeout(tick, ms);
    } else {
      isTyping = false;
      if (nextNode) {
        document.getElementById('tap-hint').style.display = 'block';
        document.getElementById('dialog-box').onclick = () => loadNode(nextNode);
      } else {
        document.getElementById('tap-hint').style.display = 'none';
      }
    }
  }
  tick();
}

function nextLine() {
  if (isTyping) {
    clearTimeout(typingTimer);
    document.getElementById('dialog-text').textContent = fullText;
    isTyping = false;
    return;
  }
}

// ── 선택지 ──
function showChoices(choices) {
  const box = document.getElementById('choices-box');
  box.innerHTML = '';
  box.classList.remove('hidden');
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    const tagClass = c.tag === 'bold' ? 'ct-bold' : c.tag === 'wise' ? 'ct-wise' : 'ct-normal';
    const tagText = c.tag === 'bold' ? '과감' : c.tag === 'wise' ? '현명' : '일반';
    btn.innerHTML = `<span class="choice-icon">${c.icon}</span>${c.text}<span class="choice-tag ${tagClass}">${tagText}</span>`;
    btn.onclick = () => {
      sfx('choice');
      gameLog.push({ speaker: '나', text: c.text, isNarr: false });
      box.classList.add('hidden');
      document.getElementById('dialog-box').style.display = 'block';
      loadNode(c.next);
    };
    box.appendChild(btn);
  });
}

// ── 나레이션 ──
let _narrationCallback = null;
function showNarration(text, cb) {
  _narrationCallback = cb;
  document.getElementById('narration-text').innerHTML = text.replace(/\n/g, '<br>');
  document.getElementById('narration').classList.add('show');
}
function closeNarration() {
  document.getElementById('narration').classList.remove('show');
  if (_narrationCallback) { _narrationCallback(); _narrationCallback = null; }
}

// ── 엔딩 ──
function showEnding(e) {
  sfx('ending');
  stopBGM();
  clearNovelProgress(); // 챕터를 끝냈으니 중간 저장 삭제
  if (e.clearKey) {
    cleared[e.clearKey] = true;
    localStorage.setItem('dalbit-novel-cleared', JSON.stringify(cleared));
  }
  document.getElementById('ending-icon').textContent = e.icon;
  document.getElementById('ending-type').textContent = e.type;
  document.getElementById('ending-title').textContent = e.title;
  document.getElementById('ending-desc').innerHTML = e.desc.replace(/\n/g, '<br>');
  document.getElementById('ending-screen').classList.add('show');
}

// ── 로그 ──
function showLog() {
  const body = document.getElementById('log-body');
  if (gameLog.length === 0) {
    body.innerHTML = '<div style="text-align:center;padding:32px;color:var(--text3);font-size:12px">아직 대화 기록이 없어요.</div>';
  } else {
    body.innerHTML = gameLog.map(e =>
      `<div class="log-entry${e.isNarr?' narr':''}">
        ${e.speaker ? `<div class="log-speaker">${e.speaker}</div>` : ''}
        ${e.text}
      </div>`
    ).join('');
  }
  document.getElementById('log-screen').classList.add('show');
  body.scrollTop = body.scrollHeight;
}
function hideLog() {
  document.getElementById('log-screen').classList.remove('show');
}

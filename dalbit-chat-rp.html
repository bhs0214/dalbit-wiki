<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>달빛여관 — 새로 온 령</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap');
:root{
  --bg:#0a0806;--card:#1a1410;--border:rgba(232,213,163,0.12);
  --moon:#e8d5a3;--moon2:#c9a84c;--ember:#c9623f;--jade:#4a7c6f;
  --text:#f0e6d3;--text2:rgba(240,230,211,0.65);--text3:rgba(240,230,211,0.28);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;display:flex;justify-content:center;}
#app{width:100%;max-width:430px;height:100vh;display:flex;flex-direction:column;position:relative;}

/* 헤더 */
#header{background:rgba(14,11,8,.97);border-bottom:1px solid var(--border);padding:12px 16px;flex-shrink:0;display:flex;align-items:center;gap:10px;}
.hdr-emoji{font-size:22px;}
.hdr-info{flex:1;}
.hdr-name{font-family:'Noto Serif KR',serif;font-size:14px;color:var(--moon);letter-spacing:.06em;}
.hdr-sub{font-size:10px;color:var(--text3);margin-top:1px;}
.hdr-btn{background:none;border:none;color:var(--text3);font-size:13px;cursor:pointer;padding:4px 8px;}

/* 채팅 영역 */
#chat{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:12px;}
#chat::-webkit-scrollbar{width:3px;}
#chat::-webkit-scrollbar-thumb{background:rgba(232,213,163,.12);border-radius:2px;}

/* 나레이션 */
.narr{text-align:center;padding:8px 16px;font-family:'Noto Serif KR',serif;font-size:12px;color:var(--text3);font-style:italic;line-height:1.8;animation:fadeIn .4s ease;}

/* NPC 메시지 */
.npc-msg{display:flex;align-items:flex-start;gap:8px;animation:slideIn .3s ease;}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
.npc-avatar{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.npc-bubble-wrap{flex:1;}
.npc-label{font-size:10.5px;color:var(--moon2);margin-bottom:4px;font-family:'Noto Serif KR',serif;}
.npc-bubble{background:var(--card);border:1px solid var(--border);border-radius:0 12px 12px 12px;padding:10px 13px;font-size:13px;font-family:'Noto Serif KR',serif;color:var(--text);line-height:1.8;}

/* 플레이어 메시지 */
.player-msg{display:flex;justify-content:flex-end;animation:slideInR .3s ease;}
@keyframes slideInR{from{opacity:0;transform:translateX(8px);}to{opacity:1;transform:translateX(0);}}
.player-bubble{background:rgba(74,124,111,.18);border:1px solid rgba(74,124,111,.25);border-radius:12px 0 12px 12px;padding:10px 13px;font-size:13px;font-family:'Noto Serif KR',serif;color:var(--text);line-height:1.8;max-width:80%;}

/* 선택지 */
.choices-wrap{display:flex;flex-direction:column;gap:7px;padding:4px 0;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.choice-btn{background:rgba(18,13,9,.9);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:12.5px;font-family:'Noto Serif KR',serif;color:var(--text2);cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;transition:all .18s;}
.choice-btn:hover{background:rgba(232,213,163,.08);border-color:rgba(232,213,163,.28);color:var(--moon);transform:translateX(4px);}
.choice-btn.used{opacity:.35;pointer-events:none;}
.choice-icon{font-size:14px;flex-shrink:0;}
.choice-tag{margin-left:auto;font-size:9.5px;padding:2px 6px;border-radius:10px;flex-shrink:0;}
.ct-n{background:rgba(74,124,111,.14);color:var(--jade);}
.ct-b{background:rgba(201,98,63,.14);color:var(--ember);}
.ct-w{background:rgba(232,213,163,.1);color:var(--moon2);}

/* 타이핑 인디케이터 */
.typing{display:flex;align-items:flex-start;gap:8px;}
.typing-dot{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.typing-bubble{background:var(--card);border:1px solid var(--border);border-radius:0 12px 12px 12px;padding:12px 16px;display:flex;gap:4px;align-items:center;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--text3);animation:dotBounce .9s infinite;}
.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}
@keyframes dotBounce{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-5px);}}

/* ── 연출: 어두워지는 화면 ── */
#dim{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at 50% 40%, transparent 20%, rgba(2,1,6,.82) 100%);
  transition:opacity 1.6s ease;}
#dim.on{opacity:1;}

/* ── 먹(墨)의 말풍선 ── */
.npc-bubble.dark{background:#0b0812;border-color:rgba(126,90,200,.3);color:#cfc4e8;
  animation:darkPulse 3s ease-in-out infinite;}
@keyframes darkPulse{
  0%,100%{box-shadow:0 0 6px rgba(90,60,160,.15);}
  50%{box-shadow:0 0 16px rgba(90,60,160,.4);}
}
.npc-avatar.dark{background:#0b0812;border-color:rgba(126,90,200,.35);
  animation:avatarTremble .18s ease-in-out infinite;}
@keyframes avatarTremble{
  0%,100%{transform:translate(0,0);}
  25%{transform:translate(.5px,-.5px);}
  75%{transform:translate(-.5px,.5px);}
}

/* ── 기억 조각 ── */
#frag-hud{font-size:10.5px;color:var(--moon2);letter-spacing:.05em;margin-right:4px;}
.frag-toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:30;
  background:rgba(14,11,8,.96);border:1px solid rgba(232,213,163,.35);border-radius:12px;
  padding:12px 20px;text-align:center;font-family:'Noto Serif KR',serif;
  animation:fragIn 3.2s ease forwards;pointer-events:none;white-space:nowrap;}
.frag-toast .ft-top{font-size:10px;color:var(--moon2);letter-spacing:.2em;margin-bottom:4px;}
.frag-toast .ft-name{font-size:14px;color:var(--moon);}
@keyframes fragIn{
  0%{opacity:0;transform:translateX(-50%) translateY(-8px);}
  10%,80%{opacity:1;transform:translateX(-50%) translateY(0);}
  100%{opacity:0;transform:translateX(-50%) translateY(-6px);}
}

/* ── 엔딩 카드 ── */
.ending-card{align-self:center;margin:20px 0;padding:26px 22px;max-width:300px;width:88%;
  background:linear-gradient(180deg,rgba(20,15,10,.98),rgba(10,8,6,.98));
  border:1px solid rgba(232,213,163,.35);border-radius:16px;text-align:center;
  animation:fadeIn .8s ease;}
.ending-card .ec-icon{font-size:38px;margin-bottom:10px;
  filter:drop-shadow(0 0 14px rgba(232,213,163,.5));}
.ending-card .ec-label{font-size:10px;letter-spacing:.25em;color:var(--moon2);margin-bottom:6px;}
.ending-card .ec-title{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:700;
  color:var(--moon);letter-spacing:.1em;margin-bottom:12px;}
.ending-card .ec-desc{font-family:'Noto Serif KR',serif;font-size:12px;color:var(--text2);
  line-height:1.9;font-style:italic;}
.ending-card .ec-frags{margin-top:14px;font-size:11px;color:var(--moon2);}
.ending-card .ec-hint{margin-top:10px;font-size:10px;color:var(--text3);line-height:1.7;}

/* 타이틀 */
#title{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;text-align:center;}
.t-moon{font-size:52px;margin-bottom:18px;animation:mglow 3s ease-in-out infinite;}
@keyframes mglow{0%,100%{filter:drop-shadow(0 0 8px rgba(232,213,163,.3));}50%{filter:drop-shadow(0 0 22px rgba(232,213,163,.8));}}
.t-main{font-family:'Noto Serif KR',serif;font-size:26px;font-weight:700;color:var(--moon);letter-spacing:.15em;margin-bottom:5px;}
.t-sub{font-size:10px;color:var(--text3);letter-spacing:.2em;margin-bottom:20px;}
.t-quote{font-family:'Noto Serif KR',serif;font-size:13px;color:var(--text2);line-height:2;font-style:italic;margin-bottom:30px;}
.t-btn{background:var(--moon);color:var(--bg);border:none;border-radius:24px;padding:12px 36px;font-size:13px;font-family:'Noto Serif KR',serif;font-weight:700;letter-spacing:.08em;cursor:pointer;transition:all .2s;}
.t-btn:hover{transform:scale(1.03);}
</style>
</head>
<body>
<div id="app">

  <!-- 타이틀 -->
  <div id="title">
    <div class="t-moon">🌕</div>
    <div class="t-main">달빛여관</div>
    <div class="t-sub">새로 온 령 — 이야기</div>
    <div class="t-quote">
      "이름도 없고, 어제도 없고.<br>
      다만— 이야기는 있다.<br><br>
      그것만으로 충분하다."
    </div>
    <button class="t-btn" onclick="startGame()">✦ 처음부터 시작</button>
    <button class="t-btn" id="continue-btn" onclick="continueGame()"
      style="display:none;margin-top:10px;background:transparent;color:var(--moon);border:1px solid rgba(232,213,163,.35);">
      ↻ 이어하기
    </button>
    <div id="endings-line" style="display:none;margin-top:16px;font-size:10.5px;color:var(--text3);letter-spacing:.1em;"></div>
  </div>

  <!-- 헤더 -->
  <div id="header">
    <div class="hdr-emoji">🏮</div>
    <div class="hdr-info">
      <div class="hdr-name">달빛여관</div>
      <div class="hdr-sub" id="hdr-sub">새로 온 령의 이야기</div>
    </div>
    <span id="frag-hud" style="display:none"></span>
    <button class="hdr-btn" onclick="resetGame()">처음부터</button>
  </div>

  <!-- 채팅 -->
  <div id="chat"></div>

  <!-- 연출: 어둠 오버레이 -->
  <div id="dim"></div>

</div>
<script>
const chat = document.getElementById('chat');

// ── 스토리 데이터 ──
const STORY = {
  start: {
    type:'narr',
    text:'어둠 속에서 눈을 뜬다. 마지막 기억이 흐릿하게 흩어진다. 몸이 가볍다— 너무 가벼워서 이상할 정도로. 코끝에 온천 냄새가 스며든다.',
    next:'arrive'
  },
  arrive: {
    type:'narr',
    text:'울창한 숲 사이로 불빛이 보인다. 처마 끝에 달린 등롱이 달빛 아래 흔들리고 있다. 나무로 된 낡은 현판. 달빛여관 (達光旅館).',
    next:'haru1'
  },
  haru1: {
    type:'npc', who:'하루', emoji:'🐄',
    text:'어서 와. 오래 기다렸어.',
    next:'haru2'
  },
  haru2: {
    type:'npc', who:'하루', emoji:'🐄',
    text:'처음이지? 이상하게 생각하지 마. 여기 오는 사람들 대부분 그래. 어리둥절한 채로 오거든. 뭐, 들어와. 차 한 잔 마시면서 얘기하자.',
    next:'choice1'
  },
  choice1: {
    type:'choices',
    choices:[
      {icon:'🚪', text:'안으로 들어간다.', tag:'n', next:'enter'},
      {icon:'❓', text:'"여기가 어디예요?"라고 묻는다.', tag:'w', next:'ask_where'},
      {icon:'🌙', text:'"제가 왜 기억이 없죠?"라고 묻는다.', tag:'w', next:'ask_memory'},
      {icon:'😤', text:'경계하며 뒤로 물러선다.', tag:'b', next:'back_off'},
      {icon:'😶', text:'말없이 서 있는다.', tag:'n', next:'silent'},
    ]
  },

  enter: {
    type:'player', text:'안으로 들어간다.',
    next:'enter_r'
  },
  enter_r: {
    type:'npc', who:'하루', emoji:'🐄',
    text:'잘 왔어. 오래 망설이는 사람도 있거든. 처음엔 다 무서운 법이지.',
    next:'world_explain'
  },

  ask_where: {
    type:'player', text:'"여기가 어디예요?"',
    next:'ask_where_r'
  },
  ask_where_r: {
    type:'npc', who:'하루', emoji:'🐄',
    text:'"영물세계야." 타코야키 젤리를 씹으며 눈을 가늘게 뜬다. "죽은 다음에 이야기가 있는 존재들이 오는 곳. 네 이야기가 충분했다는 거지."',
    next:'world_explain'
  },

  ask_memory: {
    type:'player', text:'"제가 왜 기억이 없죠?"',
    next:'ask_memory_r'
  },
  ask_memory_r: {
    type:'npc', who:'하루', emoji:'🐄',
    text:'잠깐 눈을 가늘게 뜬다. "기억을 잃었다고 이야기까지 없어지는 건 아니야. 살았던 흔적, 느꼈던 것들— 그건 몸 어딘가에 남아있어." 잠깐 멈추더니— "이름만 없는 거지."',
    next:'world_explain'
  },

  back_off: {
    type:'player', text:'경계하며 뒤로 물러선다.',
    next:'back_off_r'
  },
  back_off_r: {
    type:'npc', who:'하루', emoji:'🐄',
    text:'피식 웃는다. "경계하는 거 좋아. 근데 여기선 능력 못 써." 왼쪽 이마의 빈 자리를 가볍게 두드린다. "이 여관 안에서는 내가 규칙이야."',
    next:'world_explain'
  },

  silent: {
    type:'player', text:'말없이 서 있는다.',
    next:'silent_r'
  },
  silent_r: {
    type:'npc', who:'하루', emoji:'🐄',
    text:'그 침묵을 가만히 바라본다. 판단하는 눈이 아니다. 알아보는 눈이다. "...들어와."',
    next:'world_explain'
  },

  world_explain: {
    type:'npc', who:'하루', emoji:'🐄',
    text:'"영물세계는 선한 이야기로 태어난 영물, 악한 이야기로 태어난 요괴가 사는 곳이야. 달빛여관은— 그 둘이 전부 쉬어갈 수 있는 유일한 곳이고."',
    next:'world_explain2'
  },
  world_explain2: {
    type:'npc', who:'하루', emoji:'🐄',
    text:'"여관 안에서는 능력 사용이 전부 막혀. 싱귤러 포인트— 내 법기 덕분이야." 왼쪽 이마의 빈 자리를 가볍게 두드린다. "여기선 누구도 안 건드려. 그건 약속해."',
    next:'choice2'
  },
  choice2: {
    type:'choices',
    choices:[
      {icon:'🐄', text:'"하루씨는 어떤 영물이에요?"', tag:'n', next:'q_haru'},
      {icon:'🤔', text:'"제 이야기가 충분했다는 게 무슨 뜻이에요?"', tag:'w', next:'q_story'},
      {icon:'🌿', text:'"여관에는 어떤 사람들이 있어요?"', tag:'n', next:'q_staff'},
      {icon:'⚡', text:'"기억을 되찾을 수 있을까요?"', tag:'w', next:'q_memory'},
      {icon:'🌕', text:'"일단 방에 들어가도 될까요?"', tag:'n', next:'q_room'},
    ]
  },

  q_haru: {
    type:'player', text:'"하루씨는 어떤 영물이에요?"',
    next:'q_haru_r'
  },
  q_haru_r: {
    type:'npc', who:'하루', emoji:'🐄',
    text:'"소 영물이야. 소 가문 가주고 중앙 선녀." 뻥튀기를 씹는다. "뭐, 그냥 여관 주인이라고 생각해."',
    next:'q_haru_r2'
  },
  q_haru_r2: {
    type:'npc', who:'하루', emoji:'🐄',
    text:'"왼쪽 뿔은 없어 보이지? 법기로 쓰고 있어. 이 여관 안에서 모든 능력을 봉인하는 역할이야."',
    next:'choice2'
  },

  q_story: {
    type:'player', text:'"제 이야기가 충분했다는 게 무슨 뜻이에요?"',
    next:'q_story_r'
  },
  q_story_r: {
    type:'npc', who:'하루', emoji:'🐄',
    text:'"이야기가 있어야 영물세계에 올 수 있어. 살면서 쌓은 것들— 감정, 관계, 선택. 그게 이야기가 되는 거야."',
    next:'q_story_r2'
  },
  q_story_r2: {
    type:'npc', who:'하루', emoji:'🐄',
    text:'"네가 여기 있다는 건— 네 이야기가 충분했다는 거야. 기억은 없어도." 잠깐 멈추더니. "이야기는 몸 어딘가에 남아있어. 이름만 없는 거지."',
    next:'choice2'
  },

  q_staff: {
    type:'player', text:'"여관에는 어떤 사람들이 있어요?"',
    next:'q_staff_r'
  },
  q_staff_r: {
    type:'npc', who:'하루', emoji:'🐄',
    text:'"뮤뮤— 경비원이야. 문어 영물. 진상 오면 처리해." 뻥튀기를 씹는다. "로한은 매점 주인. 카에데는 마사지사. 쫑은 요리사— 이름은 묻지 마. 물어."',
    next:'q_staff_r2'
  },
  q_staff_r2: {
    type:'npc', who:'하루', emoji:'🐄',
    text:'"윤 의현은 지하 도서관 담당 사서야. 느긋해. 아주 느긋해." 잠깐 생각하더니— "다들 각자의 이야기가 있어."',
    next:'choice_staff'
  },
  choice_staff: {
    type:'choices',
    choices:[
      {icon:'🐙', text:'뮤뮤에 대해 더 묻는다.', tag:'n', next:'q_mumu'},
      {icon:'🐹', text:'쫑의 이름에 대해 묻는다.', tag:'b', next:'q_jong'},
      {icon:'🐯', text:'지하 도서관이 궁금하다.', tag:'w', next:'q_library'},
      {icon:'↩️', text:'다른 걸 묻는다.', tag:'n', next:'choice2'},
    ]
  },
  q_mumu: {
    type:'player', text:'"뮤뮤가 어떤 영물이에요?"',
    next:'q_mumu_r'
  },
  q_mumu_r: {
    type:'npc', who:'하루', emoji:'🐄',
    text:'"아틀란티스 출신이야. 기뢰 잠수함에서 폭사한 문어의 이야기로 태어났어." 잠깐 멈추더니. "33살. 젊은 편이지. 근데 팬던트 법기가 2m짜리 닻이야. 진상한테 방망이처럼 쓰거든."',
    next:'q_mumu_r2'
  },

// ── 엔진 ──
let isRunning = false;

// ── 자동 저장 (이어하기) ──
const SAVE_KEY = 'dalbit_chatrp_save_v1';
let savedPath = [];

function saveProgress(id) {
  savedPath.push(id);
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(savedPath)); } catch(e) {}
}
function loadProgress() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
function clearProgress() {
  savedPath = [];
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
}

// ── 게임 상태: 지나온 길(savedPath)에서 전부 계산 ──
const TOTAL_FRAGS = 7;
const ENDINGS_KEY = 'dalbit_chatrp_endings';
const ENDING_NAMES = { e_true:'🌕 이름의 조각', e_bold:'🔥 심해를 향해', e_wise:'🌊 고요한 문답' };

function computeState(path) {
  const st = { flags:{}, frags:new Set(), bold:0, wise:0 };
  for (let i = 0; i < path.length; i++) {
    const node = STORY[path[i]];
    if (!node) continue;
    if (node.set) st.flags[node.set] = true;
    if (node.fragment) st.frags.add(node.fragment.id);
    // 선택지 노드 다음에 온 노드로 어떤 선택을 했는지 역추적 → 성향 집계
    if (node.type === 'choices' && i + 1 < path.length) {
      const chosen = node.choices.find(c => c.next === path[i+1]);
      if (chosen) {
        if (chosen.tag === 'b') st.bold++;
        else if (chosen.tag === 'w') st.wise++;
      }
    }
  }
  return st;
}

function updateHud() {
  const st = computeState(savedPath);
  const hud = document.getElementById('frag-hud');
  if (st.frags.size > 0) {
    hud.style.display = 'inline';
    hud.textContent = `🌙 ${st.frags.size}/${TOTAL_FRAGS}`;
  } else {
    hud.style.display = 'none';
  }
}

function showFragToast(name) {
  const t = document.createElement('div');
  t.className = 'frag-toast';
  t.innerHTML = `<div class="ft-top">✦ 기억 조각 발견 ✦</div><div class="ft-name">「${name}」</div>`;
  document.getElementById('app').appendChild(t);
  setTimeout(() => t.remove(), 3300);
}

function loadEndings() {
  try { return JSON.parse(localStorage.getItem(ENDINGS_KEY) || '{}'); } catch(e) { return {}; }
}
function recordEnding(eid) {
  const e = loadEndings();
  e[eid] = true;
  try { localStorage.setItem(ENDINGS_KEY, JSON.stringify(e)); } catch(err) {}
}

function setDim(on) {
  document.getElementById('dim').classList.toggle('on', !!on);
}

function renderEndingCard(node) {
  const st = computeState(savedPath);
  const done = loadEndings();
  const doneCount = Object.keys(ENDING_NAMES).filter(k => done[k]).length;
  const div = document.createElement('div');
  div.className = 'ending-card';
  div.innerHTML = `
    <div class="ec-icon">${node.icon}</div>
    <div class="ec-label">— ${node.label} —</div>
    <div class="ec-title">${node.title}</div>
    <div class="ec-desc">${node.desc.replace(/\n/g,'<br>')}</div>
    <div class="ec-frags">🌙 모은 기억 조각 ${st.frags.size}/${TOTAL_FRAGS} · 엔딩 ${doneCount}/3</div>
    <div class="ec-hint">다른 선택은 다른 이야기를 만듭니다.<br>「처음부터」로 새로운 길을 걸어보세요.</div>`;
  chat.appendChild(div);
  scrollDown();
}

// 저장이 있으면 타이틀에 '이어하기' 버튼 표시 + 달성 엔딩 표시
(function initContinueBtn(){
  const p = loadProgress();
  if (p && p.length > 0) {
    document.getElementById('continue-btn').style.display = 'inline-block';
  }
  const done = loadEndings();
  const names = Object.keys(ENDING_NAMES).filter(k => done[k]).map(k => ENDING_NAMES[k]);
  if (names.length > 0) {
    const line = document.getElementById('endings-line');
    line.style.display = 'block';
    line.textContent = `달성한 엔딩 ${names.length}/3 · ${names.join(' · ')}`;
  }
})();

function startGame() {
  clearProgress();
  setDim(false);
  updateHud();
  document.getElementById('title').style.display = 'none';
  runNode('start');
}

function resetGame() {
  if (!confirm('처음부터 다시 시작할까요?\n(저장된 진행 상황이 사라집니다)')) return;
  clearProgress();
  setDim(false);
  updateHud();
  chat.innerHTML = '';
  runNode('start');
}

// 저장된 경로를 즉시 다시 그리기
function continueGame() {
  const path = loadProgress();
  if (!path || !path.length) { startGame(); return; }
  document.getElementById('title').style.display = 'none';
  chat.innerHTML = '';
  savedPath = path.slice();

  let dim = false;
  for (let i = 0; i < path.length; i++) {
    const node = STORY[path[i]];
    if (!node) continue;
    if (node.fx === 'dark') dim = true;
    else if (node.fx === 'light') dim = false;
    const isLast = i === path.length - 1;
    if (node.type === 'narr') addNarr(node.text);
    else if (node.type === 'npc') addNpc(node.who, node.emoji, node.text);
    else if (node.type === 'player') addPlayer(node.text);
    else if (node.type === 'choices' && isLast) addChoices(node.choices);
    // branch / ending 노드는 다시 그리지 않음
  }
  setDim(dim);
  updateHud();

  // 마지막 노드가 선택지가 아니면 이어서 진행
  const last = STORY[path[path.length - 1]];
  scrollDown();
  if (last && last.type !== 'choices') {
    if (last.type === 'branch') {
      savedPath.pop(); // 중복 기록 방지 후 재평가
      runNode(path[path.length - 1]);
    } else {
      const nx = resolveNext(last);
      if (nx) runNode(nx);
    }
  }
}

// nextIf: [['플래그', '노드id'], ...] 순서대로 검사, 없으면 next
function resolveNext(node) {
  if (node.nextIf) {
    const st = computeState(savedPath);
    for (const pair of node.nextIf) {
      if (st.flags[pair[0]]) return pair[1];
    }
  }
  return node.next;
}

async function runNode(id) {
  if (isRunning) return;
  const node = STORY[id];
  if (!node) return;

  // 분기 노드: 화면에 그리지 않고 조건에 따라 점프
  if (node.type === 'branch') {
    saveProgress(id);
    const st = computeState(savedPath);
    for (const r of node.rules) {
      if (r.flag && !st.flags[r.flag]) continue;
      if (r.frags && st.frags.size < r.frags) continue;
      if (r.bold && st.bold < st.wise) continue;
      runNode(r.next);
      return;
    }
    return;
  }

  saveProgress(id);
  isRunning = true;

  // 연출: 화면 어둡게/밝게
  if (node.fx === 'dark') setDim(true);
  else if (node.fx === 'light') setDim(false);

  // 기억 조각 발견 (처음 얻을 때만 알림)
  if (node.fragment) {
    const before = computeState(savedPath.slice(0, -1));
    if (!before.frags.has(node.fragment.id)) showFragToast(node.fragment.name);
    updateHud();
  }

  // 엔딩 카드
  if (node.type === 'ending') {
    recordEnding(node.eid);
    setDim(false);
    await delay(800);
    renderEndingCard(node);
    clearProgress();
    isRunning = false;
    return;
  }

  if (node.type === 'narr') {
    await delay(200);
    addNarr(node.text);
    await delay(600);
    isRunning = false;
    const nx = resolveNext(node);
    if (nx) runNode(nx);

  } else if (node.type === 'npc') {
    await delay(300);
    const typing = addTyping(node.emoji);
    await delay(700 + node.text.length * 18);
    typing.remove();
    addNpc(node.who, node.emoji, node.text);
    scrollDown();
    await delay(400);
    isRunning = false;
    const nx = resolveNext(node);
    if (nx) runNode(nx);

  } else if (node.type === 'player') {
    addPlayer(node.text);
    scrollDown();
    await delay(200);
    isRunning = false;
    const nx = resolveNext(node);
    if (nx) runNode(nx);

  } else if (node.type === 'choices') {
    if (node.slow) await delay(900); // 중요한 선택 전, 잠깐의 침묵
    addChoices(node.choices);
    scrollDown();
    isRunning = false;
  }
}

function addNarr(text) {
  const div = document.createElement('div');
  div.className = 'narr';
  div.innerHTML = text.replace(/\n/g, '<br>');
  chat.appendChild(div);
  scrollDown();
}

function addNpc(who, emoji, text) {
  const div = document.createElement('div');
  div.className = 'npc-msg';
  const dark = who === '먹' ? ' dark' : ''; // 먹(墨)은 어둠의 연출
  div.innerHTML = `
    <div class="npc-avatar${dark}">${emoji}</div>
    <div class="npc-bubble-wrap">
      <div class="npc-label">${who}</div>
      <div class="npc-bubble${dark}">${text}</div>
    </div>`;
  chat.appendChild(div);
}

function addPlayer(text) {
  const div = document.createElement('div');
  div.className = 'player-msg';
  div.innerHTML = `<div class="player-bubble">${text}</div>`;
  chat.appendChild(div);
}

function addTyping(emoji) {
  const div = document.createElement('div');
  div.className = 'typing';
  div.innerHTML = `
    <div class="typing-dot">${emoji}</div>
    <div class="typing-bubble">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>`;
  chat.appendChild(div);
  scrollDown();
  return div;
}

function addChoices(choices) {
  const wrap = document.createElement('div');
  wrap.className = 'choices-wrap';
  // 조건(req)이 있는 선택지는 해당 플래그를 얻었을 때만 표시
  const st = computeState(savedPath);
  choices = choices.filter(c => !c.req || st.flags[c.req]);
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    const tagClass = c.tag==='b'?'ct-b':c.tag==='w'?'ct-w':'ct-n';
    const tagText = c.tag==='b'?'과감':c.tag==='w'?'현명':'일반';
    btn.innerHTML = `<span class="choice-icon">${c.icon}</span>${c.text}<span class="choice-tag ${tagClass}">${tagText}</span>`;
    btn.onclick = () => {
      // 선택지 전체 비활성화
      wrap.querySelectorAll('.choice-btn').forEach(b => b.classList.add('used'));
      btn.style.opacity = '1';
      btn.style.borderColor = 'rgba(232,213,163,.3)';
      btn.style.color = 'var(--moon)';
      runNode(c.next);
    };
    wrap.appendChild(btn);
  });
  chat.appendChild(wrap);
}

function scrollDown() {
  setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 50);
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

<div id="login" class="form" style="max-width:420px">

<script>
// APPLY_URL 은 characters.html 과 같은 주소입니다 (빌드 시 자동으로 채워짐)
const APPLY_URL = 'https://script.google.com/macros/s/AKfycbyGJo19be26sFv4Xb6d5jCg_V0ncwXQgCrxczcI5Qnzvo0DJDGEv1umaStNCaBTgAf7/exec';
const STATUSES = ['심사중','활동중','휴면','소멸','반려'];
const FIELDS = [['name','이름'],['owner','오너'],['editCode','수정 코드 (신청자가 직접 고칠 때 쓰는 열쇠)'],['kind','종족'],['origin','출신'],['motif','모티프'],['age','나이'],['gender','성별'],['partner','계약 상대 (인간)'],['affiliation','소속'],['base','거점'],['role','직책'],['look','외형'],['personality','성격'],['story','이야기'],
  ['artifact','법기 1'],['rank','랭크 1'],['artifactDesc','법기 1 설명'],['artifactImage','법기 1 사진 주소'],
  ['artifact2','법기 2'],['rank2','랭크 2'],['artifactDesc2','법기 2 설명'],['artifactImage2','법기 2 사진 주소'],
  ['artifact3','법기 3'],['rank3','랭크 3'],['artifactDesc3','법기 3 설명'],['artifactImage3','법기 3 사진 주소'],
  ['skills','술식 1'],['skillDesc','술식 1 설명'],['skills2','술식 2'],['skillDesc2','술식 2 설명'],['skills3','술식 3'],['skillDesc3','술식 3 설명'],
  ['relations','관계'],['line','한줄'],['image','캐릭터 이미지 주소']];
const LONG = new Set(['look','personality','story','artifactDesc','artifactDesc2','artifactDesc3','skillDesc','skillDesc2','skillDesc3','relations']);
function skillsOf(c){ return [[c.skills,c.skillDesc],[c.skills2,c.skillDesc2],[c.skills3,c.skillDesc3]].filter(s=>s[0]||s[1]).map(([name,desc])=>({name,desc})); }
const IMG_KEYS = [['image','캐릭터 이미지'],['artifactImage','법기 1 사진'],['artifactImage2','법기 2 사진'],['artifactImage3','법기 3 사진']];
function artifactsOf(c){ return [[c.artifact,c.rank,c.artifactDesc,c.artifactImage],[c.artifact2,c.rank2,c.artifactDesc2,c.artifactImage2],[c.artifact3,c.rank3,c.artifactDesc3,c.artifactImage3]].filter(a=>a[0]).map(([name,rank,desc,img])=>({name,rank,desc,img})); }
const okImg=u=>/^https:\/\/(drive\.google\.com|lh3\.googleusercontent\.com|[\w.-]+\.githubusercontent\.com)\//.test(u||'');
let ITEMS = [], stF = '심사중', KEY = '';
const $ = id => document.getElementById(id);
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function api(body){
  const r = await fetch(APPLY_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(Object.assign({_type:'admin', key:KEY}, body))});
  return r.json();
}
async function load(){
  $('alist').innerHTML = '<div class="empty">불러오는 중…</div>';
  try{
    const d = await api({action:'list'});
    if(!d.ok){ if(d.error==='key'){ logout('비밀번호가 틀렸어요.'); } else $('alist').innerHTML = '<div class="empty">오류: '+esc(d.error)+'</div>'; return; }
    ITEMS = d.items; render();
  }catch(e){ $('alist').innerHTML = '<div class="empty">시트를 불러오지 못했어요. Apps Script 를 새 코드로 재배포했는지 확인해 주세요.<br><small>'+esc(e)+'</small></div>'; }
}
const LABEL = Object.fromEntries(FIELDS.map(([k,l])=>[k,l.replace(/ \(.*\)$/,'')]));
function pendingOf(c){ try{ const o=JSON.parse(c.pending||''); return o&&typeof o==='object'?o:null; }catch(e){ return null; } }
function render(){
  const q = ($('aq').value||'').trim().toLowerCase();
  const list = ITEMS.filter(c => (stF==='전체' || (stF==='수정 대기' ? !!pendingOf(c) : (c.status||'')===stF)) && (!q || [c.name,c.owner].join(' ').toLowerCase().includes(q)));
  STATUSES.forEach(s => { const b = document.querySelector(`#st-chips .chip[data-s="${s}"]`); const n = ITEMS.filter(c=>c.status===s).length; b.textContent = s + (n?` ${n}`:''); });
  { const n = ITEMS.filter(c=>pendingOf(c)).length; const b = document.querySelector('#st-chips .chip[data-s="수정 대기"]'); b.textContent = '✎ 수정 대기' + (n?` ${n}`:''); b.classList.toggle('alert', n>0); }
  $('acount').textContent = list.length ? `${list.length}건` : '';
  $('alist').innerHTML = list.length ? list.map(card).join('') : '<div class="empty">여기에 해당하는 신청이 없어요</div>';
}
function badge(s){ const cls = {심사중:'b-wait',활동중:'b-on',휴면:'b-dim',소멸:'b-gone',반려:'b-no'}[s]||'b-dim'; return `<span class="badge ${cls}">${esc(s||'(없음)')}</span>`; }
function card(c){
  const who = c.kind==='인간' ? '인간' : [c.origin, c.motif].filter(Boolean).join(' · ');
  const where = [c.affiliation, c.role, c.base].filter(Boolean).join(' · ');
  const btn = (s, label, cls='') => c.status===s ? '' : `<button class="abtn ${cls}" data-act="status" data-row="${c.row}" data-s="${s}">${label}</button>`;
  const ag=[c.age,c.gender].filter(Boolean).join(' · ');
  const img=okImg(c.image);
  const line=(label,v)=>v?`<div><b>${label}</b> ${esc(v)}</div>`:'';
  const p=pendingOf(c);
  const pend=p?`<div class="pending"><div class="pending-head">✎ 신청자가 보낸 수정본 <small>${esc(p._at||'')}</small> — 적용하기 전까지 인명부에는 예전 내용이 보여요</div>
      ${Object.keys(p).filter(k=>k!=='_at').map(k=>`<div class="pdiff"><b>${esc(LABEL[k]||k)}</b><div class="pold">${esc(c[k]||'(비어 있음)')}</div><div class="pnew">${esc(p[k]||'(비움)')}</div></div>`).join('')}
      <div class="abtns"><button class="abtn primary" data-act="pending_apply" data-row="${c.row}">✓ 수정 적용</button><button class="abtn" data-act="pending_reject" data-row="${c.row}">돌려보내기 (버림)</button></div></div>`:'';
  return `<div class="acard${p?' has-pending':''}" id="row-${c.row}">
    <div class="ahead">
      <div class="aemoji${img?' has-img':''}">${img?`<img src="${esc(c.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:({영물:'🌕',요괴:'🌑',인간:'🧍'}[c.kind]||'🌙')}</div>
      <div class="atitle"><b>${esc(c.name)}</b> ${badge(c.status)}${p?' <span class="badge b-edit">✎ 수정 대기</span>':''} <span class="arank">${esc(c.rank||'')}</span>
        <div class="ameta">${esc(c.kind||'')} · ${esc(who)}${ag?' · '+esc(ag):''}${where?' · '+esc(where):''} · by ${esc(c.owner)} <span class="adate">${esc(c.date)}</span></div>
        ${c.kind==='인간'&&c.partner?`<div class="ameta">🤝 계약 — ${esc(c.partner)}</div>`:''}</div>
    </div>
    <div class="abody">
      ${artifactsOf(c).map((a,i,arr)=>line('법기'+(arr.length>1?' '+(i+1):''), a.name+(a.rank?' ('+a.rank+')':'')+(a.desc?' — '+a.desc:'')+(okImg(a.img)?' 📷':''))).join('')}
      ${line('외형', c.look)}${line('성격', c.personality)}
      ${line(c.kind==='인간'?'왜 계약했는가':'이야기', c.story)}
      ${skillsOf(c).map((s,i,arr)=>line('술식'+(arr.length>1?' '+(i+1):''), (s.name||'')+(s.desc?' — '+s.desc:''))).join('')}${line('관계', c.relations)}${line('한 줄', c.line)}
      ${c.image&&!img?line('이미지', c.image):''}
    </div>
    ${pend}
    <div class="abtns">
      ${btn('활동중','✓ 승인 (활동중)','primary')}${btn('반려','반려')}${btn('휴면','휴면')}${btn('소멸','소멸 (책으로)')}
      <button class="abtn" data-act="edit" data-row="${c.row}">✎ 수정</button>
      <button class="abtn danger" data-act="delete" data-row="${c.row}">삭제</button>
    </div>
    <div class="aedit" id="edit-${c.row}" style="display:none"></div>
  </div>`;
}
function editForm(c){
  const f = FIELDS.map(([k,label]) => LONG.has(k)
    ? `<div class="field"><label>${label}</label><textarea name="${k}">${esc(c[k])}</textarea></div>`
    : `<div class="field"><label>${label}</label><input name="${k}" value="${esc(c[k])}"></div>`).join('');
  const imgs = IMG_KEYS.map(([k,label]) => `<div class="field"><label>${label} 바꾸기 <small>(선택)</small></label><input type="file" name="file_${k}" accept="image/*"></div>`).join('');
  return `<form class="form" data-row="${c.row}">${f}
    <div class="fsec">사진 바꾸기</div>${imgs}<div class="hint">고르면 저장할 때 드라이브에 새로 올라가고 주소가 바뀝니다. 사진을 없애려면 위의 '사진 주소' 칸을 비우세요.</div>
    <div class="abtns"><button class="abtn primary" type="submit">저장</button><button class="abtn" type="button" data-act="cancel" data-row="${c.row}">취소</button></div><div class="msg"></div></form>`;
}
function shrink(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{ URL.revokeObjectURL(url);
      const MAX=1000, s=Math.min(1, MAX/Math.max(im.width,im.height));
      const cv=document.createElement('canvas'); cv.width=Math.round(im.width*s); cv.height=Math.round(im.height*s);
      const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height); g.drawImage(im,0,0,cv.width,cv.height);
      const keepPng=file.type==='image/png'&&file.size<400*1024;
      const dataUrl=keepPng?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',0.86);
      res({data:dataUrl.split(',')[1], type:keepPng?'image/png':'image/jpeg'}); };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('이미지를 읽을 수 없어요')); };
    im.src=url; });
}
async function setStatus(row, s){
  const c = ITEMS.find(x=>x.row===row); if(!c) return;
  busy(row, true);
  const d = await api({action:'status', row, status:s}).catch(()=>({ok:false,error:'net'}));
  if(d.ok){ c.status = s; render(); } else { alert('실패: '+d.error); busy(row,false); }
}
async function del(row){
  const c = ITEMS.find(x=>x.row===row); if(!c) return;
  if(!confirm(`「${c.name}」을(를) 시트에서 완전히 지울까요?\n소멸한 캐릭터라면 삭제 대신 「소멸」을 권해요.`)) return;
  busy(row, true);
  const d = await api({action:'delete', row}).catch(()=>({ok:false,error:'net'}));
  if(d.ok){ await load(); } else { alert('실패: '+d.error); busy(row,false); }   // 행 번호가 바뀌므로 다시 읽음
}
function busy(row, on){ const el = $('row-'+row); if(el) el.style.opacity = on ? .45 : 1; }

$('alist').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]'); if(!b) return;
  const row = +b.dataset.row, act = b.dataset.act;
  if(act==='status') setStatus(row, b.dataset.s);
  else if(act==='delete') del(row);
  else if(act==='pending_apply'||act==='pending_reject'){
    const c = ITEMS.find(x=>x.row===row); const p = pendingOf(c); if(!c||!p) return;
    if(act==='pending_reject' && !confirm(`「${c.name}」의 수정본을 버릴까요? 신청자가 다시 보내야 해요.`)) return;
    busy(row,true);
    const d = await api({action:act, row}).catch(()=>({ok:false,error:'net'}));
    if(d.ok){ if(act==='pending_apply'){ for(const k in p) if(k!=='_at') c[k]=p[k]; } c.pending=''; render(); } else { alert('실패: '+d.error); busy(row,false); }
  }
  else if(act==='edit'){ const c = ITEMS.find(x=>x.row===row); const box = $('edit-'+row); box.innerHTML = editForm(c); box.style.display = 'block'; }
  else if(act==='cancel'){ const box = $('edit-'+row); box.style.display = 'none'; box.innerHTML = ''; }
});
$('alist').addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target; const row = +f.dataset.row;
  const fields = Object.fromEntries([...new FormData(f).entries()].filter(([k,v])=>!(v instanceof File)));
  const msg = f.querySelector('.msg'); msg.textContent = '저장 중…'; msg.className = 'msg';
  for(const [k] of IMG_KEYS){ const el=f.elements['file_'+k]; const file=el&&el.files[0]; if(!file) continue;
    try{ const im = await shrink(file); fields[k+'Data'] = im.data; fields[k+'Type'] = im.type; }catch(err){ msg.textContent = err.message; msg.className='msg err'; return; } }
  const d = await api({action:'update', row, fields}).catch(()=>({ok:false,error:'net'}));
  if(d.ok){ const c = ITEMS.find(x=>x.row===row); for(const [k] of IMG_KEYS){ delete fields[k+'Data']; delete fields[k+'Type']; } Object.assign(fields, d.images||{}); Object.assign(c, fields); render(); }
  else { msg.textContent = '실패: '+d.error; msg.className = 'msg err'; }
});
$('st-chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if(!b) return; [...e.currentTarget.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); stF = b.dataset.s; render(); });
$('aq').addEventListener('input', render);
$('reload').addEventListener('click', load);

// ── 신문 ──
let NEWS=[], nsF='전체';
const SEC_CLASS={'특종':'s-top','속보':'s-flash','기획':'s-feat','생활':'s-life','추적 중':'s-open','해결':'s-done','공지':'s-notice'};
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function normDate(d){ d=String(d||'').trim(); if(/^\d{4}-\d{2}-\d{2}/.test(d)) return d.slice(0,10); const t=new Date(d); if(isNaN(t)) return d; return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
async function loadNews(){
  $('news-alist').innerHTML='<div class="empty">불러오는 중…</div>';
  const d=await api({action:'news_list'}).catch(()=>({ok:false,error:'net'}));
  if(!d.ok){ $('news-alist').innerHTML='<div class="empty">신문을 불러오지 못했어요: '+esc(d.error)+'<br><small>Apps Script 를 신문 기능이 든 새 코드로 재배포했는지 확인해 주세요.</small></div>'; return; }
  d.items.forEach(n=>n.date=normDate(n.date)); NEWS=d.items.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.row-a.row); renderNews();
}
function renderNews(){
  const list=NEWS.filter(n=>nsF==='전체'||(nsF==='추적 중'?n.section==='추적 중':n.status===nsF));
  $('news-count').textContent=list.length?`${list.length}건 · 게시 ${NEWS.filter(n=>n.status==='게시').length} · 초안 ${NEWS.filter(n=>n.status!=='게시').length}`:'';
  $('news-alist').innerHTML=list.length?list.map(n=>`<div class="acard" id="nrow-${n.row}">
    <div class="ahead"><div class="atitle"><span class="sec ${SEC_CLASS[n.section]||'s-life'}">${esc(n.section)}</span> ${badge(n.status)} <span class="adate">${esc(n.date)}</span>
      <div style="font-weight:600;margin-top:4px">${esc(n.title)}</div></div></div>
    <div class="abody" style="max-height:120px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent)">${esc(n.body)}</div>
    <div class="abtns">
      ${n.status==='게시'?`<button class="abtn" data-nact="status" data-row="${n.row}" data-s="초안">내리기 (초안으로)</button>`:`<button class="abtn primary" data-nact="status" data-row="${n.row}" data-s="게시">게시</button>`}
      ${n.section==='추적 중'?`<button class="abtn" data-nact="resolve" data-row="${n.row}">✓ 해결됨으로</button>`:''}
      <button class="abtn" data-nact="edit" data-row="${n.row}">✎ 수정</button>
      <button class="abtn danger" data-nact="delete" data-row="${n.row}">삭제</button>
    </div></div>`).join(''):'<div class="empty">기사가 없어요. 위에서 첫 기사를 써보세요.</div>';
}
const nf=$('news-form');
function newsReset(){ nf.reset(); nf.elements.row.value=''; nf.elements.date.value=today(); $('news-form-title').textContent='새 기사'; $('news-save').textContent='올리기'; $('news-cancel').style.display='none'; $('news-msg').textContent=''; }
nf.addEventListener('submit', async e=>{
  e.preventDefault(); const f=Object.fromEntries(new FormData(nf).entries()); const row=+f.row; delete f.row;
  const msg=$('news-msg'); msg.className='msg'; msg.textContent='저장 중…';
  const d=await api(row?{action:'news_update',row,fields:f}:{action:'news_add',fields:f}).catch(()=>({ok:false,error:'net'}));
  if(d.ok){ msg.className='msg ok'; msg.textContent=row?'✓ 수정했어요':'✓ 올렸어요'; newsReset(); loadNews(); }
  else { msg.className='msg err'; msg.textContent='실패: '+d.error; }
});
$('news-cancel').addEventListener('click', newsReset);
$('news-reload').addEventListener('click', loadNews);
$('ns-chips').addEventListener('click', e=>{ const b=e.target.closest('.chip'); if(!b) return; [...e.currentTarget.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); nsF=b.dataset.s; renderNews(); });
$('news-alist').addEventListener('click', async e=>{
  const b=e.target.closest('button[data-nact]'); if(!b) return; const row=+b.dataset.row, act=b.dataset.nact; const n=NEWS.find(x=>x.row===row); if(!n) return;
  if(act==='edit'){ for(const k of ['date','section','title','body','status']) nf.elements[k].value=n[k]||''; nf.elements.row.value=row; $('news-form-title').textContent='기사 수정'; $('news-save').textContent='수정 저장'; $('news-cancel').style.display='inline-block'; nf.scrollIntoView({behavior:'smooth'}); return; }
  if(act==='delete'){ if(!confirm(`「${n.title}」 기사를 지울까요?`)) return; }
  const body=act==='status'?{action:'news_status',row,status:b.dataset.s}:act==='resolve'?{action:'news_update',row,fields:{section:'해결'}}:{action:'news_delete',row};
  const d=await api(body).catch(()=>({ok:false,error:'net'}));
  if(d.ok) loadNews(); else alert('실패: '+d.error);
});
$('tabs').addEventListener('click', e=>{ const b=e.target.closest('.tab'); if(!b) return; [...$('tabs').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  const news=b.dataset.t==='news'; $('tab-news').style.display=news?'block':'none'; $('tab-chars').style.display=news?'none':'block'; if(news&&!NEWS.length) loadNews(); });

function logout(msg){ KEY=''; try{sessionStorage.removeItem('dalbit-admin-key');}catch(e){} $('panel').style.display='none'; $('login').style.display='block'; $('login-msg').textContent = msg||''; $('login-msg').className='msg err'; }
function login(k){ KEY = k; try{sessionStorage.setItem('dalbit-admin-key',k);}catch(e){} $('login').style.display='none'; $('panel').style.display='block'; newsReset(); load(); }
$('login-btn').addEventListener('click', () => { const k = $('key').value.trim(); if(k) login(k); });
$('key').addEventListener('keydown', e => { if(e.key==='Enter') $('login-btn').click(); });
$('logout').addEventListener('click', () => logout());
try{ const k = sessionStorage.getItem('dalbit-admin-key'); if(k) login(k); }catch(e){}
</script>
